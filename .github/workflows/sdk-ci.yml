name: SDK CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  distribution:
    name: Package integrity and Python tests
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.7'
          cache: pip
          cache-dependency-path: engine-sdk/requirements-sdk.txt
      - name: Install the recorded SDK tools
        id: sdk-tools
        run: python -m pip install -r engine-sdk/requirements-sdk.txt
      - name: Verify SDK, Template and documentation
        run: python -B ci/verify_distribution.py --output test-results/distribution.json
      - name: Run shipped Python regression tests
        if: ${{ !cancelled() && steps.sdk-tools.outcome == 'success' }}
        env:
          # Use the runner's canonical path instead of its legacy 8.3 user TEMP alias.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: python -B ci/run_python_tests.py --output test-results/python.json
      - name: Publish job summary
        if: always()
        run: python -B ci/reporting.py --directory test-results
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-and-python-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  browser:
    name: Browser tests (${{ matrix.webgpu }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        webgpu: ['off', software]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.7'
          cache: pip
          cache-dependency-path: ci/requirements-browser.txt
      - name: Install browser test tools
        run: python -m pip install -r ci/requirements-browser.txt
      - name: Install pinned Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Exercise source and compiled browser APIs
        env:
          DEBUG: pw:browser
        run: python -B ci/browser_smoke.py --webgpu ${{ matrix.webgpu }} --output test-results/browser-${{ matrix.webgpu }}.json
      - name: Publish job summary
        if: always()
        run: python -B ci/reporting.py --directory test-results
      - name: Retain browser results and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ matrix.webgpu }}-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
