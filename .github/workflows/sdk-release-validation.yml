name: SDK release validation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sdk-release-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  rebuild:
    name: Offline JavaScript rebuilding
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.7'
          cache: pip
          cache-dependency-path: |
            engine-sdk/requirements-sdk.txt
            ci/requirements-browser.txt
      - name: Install the recorded build and browser prerequisites
        run: python -m pip install -r engine-sdk/requirements-sdk.txt -r ci/requirements-browser.txt
      - name: Install pinned Chromium
        run: python -m playwright install chromium
      - name: Rebuild offline twice and execute a source change
        run: python -B ci/rebuild_acceptance.py --output test-results/rebuild
      - name: Publish actual rebuilding results
        if: always()
        run: python -B ci/reporting.py --report test-results/rebuild/report.json
      - name: Retain rebuilding logs, inventories and browser proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-rebuild-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  endurance:
    name: Software WebGPU endurance (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [source, compiled]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.7'
          cache: pip
          cache-dependency-path: ci/requirements-browser.txt
      - name: Install browser test prerequisites
        run: python -m pip install -r ci/requirements-browser.txt
      - name: Install pinned Chromium and system libraries
        run: python -m playwright install --with-deps chromium
      - name: Run 100 lifecycle cycles and ten minutes of simulation
        env:
          DEBUG: pw:browser
        run: python -B ci/endurance.py --mode ${{ matrix.mode }} --duration 600 --cycles 100 --output test-results/endurance-${{ matrix.mode }}.json
      - name: Publish actual endurance measurements
        if: always()
        run: python -B ci/reporting.py --directory test-results
      - name: Retain endurance results and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: endurance-${{ matrix.mode }}-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
