[package]
name = "particle_compute"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
panic = "abort"
lto = true
codegen-units = 1
strip = "debuginfo"
