  t('a coordinator crash after prepare is recoverable from the durable record', () => {
    const cc = new CrossShardCoordinator(['s']);
    cc.prepare('tx1', [{ shardId: 's', key: 'k', value: 7 }]);
    assert(cc.isPrepared('tx1'), 'in-doubt window after prepare');
    const rec = cc.recover('tx1'); // 2PC blocking failure made recoverable
    assert(rec.ok && cc.read('s', 'k') === 7, 'recovery completes the in-doubt commit');
  });

  // ── P6: Quorum checkpoints (rule 64) ──────────────────────────────────────────
  G('CSE P6 · Quorum checkpoints');

  t('a checkpoint finalizes only when a quorum attests the same state root', () => {
    const cq = new CheckpointQuorum({ members: ['n0', 'n1', 'n2'] }); // quorum 2
    cq.propose({ id: 'cp1', stateRoot: 'root-abc' });
    cq.attest('cp1', 'n0', 'root-abc');
    assert(!cq.isFinalized('cp1'), 'one attestation is not a quorum');
    cq.attest('cp1', 'n1', 'root-abc');
    assert(cq.isFinalized('cp1'), 'two matching attestations finalize');
    assert(cq.proof('cp1').finalized && cq.proof('cp1').attestors.length === 2, 'proof reflects the quorum');
  });

  t('a divergent replica cannot count toward quorum', () => {
    const cq = new CheckpointQuorum({ members: ['n0', 'n1', 'n2'] });
    cq.propose({ id: 'cp1', stateRoot: 'good' });
    cq.attest('cp1', 'n0', 'good');
    cq.attest('cp1', 'n1', 'FORKED'); // divergent root
    assert(!cq.isFinalized('cp1'), 'a divergent attestation does not finalize');
    assert(eq(cq.divergent('cp1'), ['n1']), 'the divergent replica is flagged');
  });

  // ── P7: Simulation clocks — many clocks, no universal time (§9) ───────────────
  G('CSE P7 · Simulation clocks');

  t('simulation clocks advance independently; there is no universal clock', () => {
    const set = new SimulationClockSet();
    set.clock('physics').step(3);
    set.clock('biology', { rate: 2 }).step(4);
    const snap = set.snapshot();
    assert(snap.physics === 3 && snap.biology === 8, 'each domain clock advances on its own');
    const c = new SimulationClock('x'); c.step(2); c.step(2);
    assert(c.now() === 4 && c.steps() === 4, 'stepping is deterministic and cumulative');
  });

  // ── P7: Deterministic world dynamics — replayability (rules 66/68) ────────────
  G('CSE P7 · World dynamics');

  t('world dynamics are deterministic: same seed + inputs → identical result', () => {
    const make = () => new WorldDynamics({ seed: 'abc', step: (s, ctx) => ({ v: s.v + Math.floor(ctx.rand() * 10) + ctx.dt }) });
    const a = make().run({ v: 0 }, new SimulationClock('t'), { steps: 5, dt: 1 });
    const b = make().run({ v: 0 }, new SimulationClock('t'), { steps: 5, dt: 1 });
    assert(eq(a.state, b.state), 'identical results enable deterministic replay');
    assert(eq(a.ticks, [1, 2, 3, 4, 5]), 'sim clock advances one tick per step');
  });

  // ── P7: Resonance/perception index — retrieve→verify discipline (rules 52–56) ─
  G('CSE P7 · Resonance index');

  t('approximate retrieval ranks candidates but never asserts identity', () => {
    const idx = new ResonanceIndex();
    idx.add('apple', [1, 0, 0], 'APPLE-BYTES');
    idx.add('appl3', [0.99, 0.01, 0], 'APPL3-BYTES'); // near-identical vector, different bytes
    const cands = idx.candidates([1, 0, 0], 2);
    assert(cands[0].id === 'apple' && cands[0].similarity >= cands[1].similarity, 'most similar ranked first');
    const r1 = idx.resolve([1, 0, 0], 'APPLE-BYTES');
    assert(r1.match === 'apple' && r1.verifiedBy.includes('exact-hash'), 'identity established only by exact bytes');
    const r2 = idx.resolve([1, 0, 0], 'NOT-IN-INDEX');
    assert(r2.match === null, 'a merely-similar candidate is never accepted (similarity ≠ identity)');
    const r3 = idx.resolve([1, 0, 0], 'APPLE-BYTES', { semantic: () => false });
    assert(r3.match === null, 'a semantic constraint can still reject an exact byte match');
  });

  // ── P8: Proposal pool — competing proposals (rules 27–28) ─────────────────────
  G('CSE P8 · Proposal pool');

  t('proposals contending for the same input compete; losers are superseded', () => {
    const pool = new ProposalPool();
    pool.submit({ transactionID: 'tx-a', consumeSet: ['object-version:file.main:14'] });
    pool.submit({ transactionID: 'tx-b', consumeSet: ['object-version:file.main:14'] });
    pool.submit({ transactionID: 'tx-c', consumeSet: ['object-version:other:1'] });
    const { winners, superseded } = pool.resolve();
    assert(winners.length === 2, 'one winner per conflict + the non-conflicting proposal');
    assert(pool.status('tx-a') === PROPOSAL_STATUS.WINNER, 'deterministic winner by priority');
    assert(superseded.length === 1 && pool.status('tx-b') === PROPOSAL_STATUS.SUPERSEDED, 'loser superseded, never overwritten');
  });

  // ── P8: Serializable commit queue (rule 24) ───────────────────────────────────
  G('CSE P8 · Serializable queue');

  t('serializable queue rejects non-serializable interleavings, allows them after commit', () => {
    const q = new SerializableQueue();
    assert(q.admit('t1', ['x'], ['x']).ok, 'first tx admitted');
    const b = q.admit('t2', ['x'], []); // reads x that t1 writes → rw antidependency
    assert(!b.ok && b.reason === 'serialization-conflict', 'conflicting interleaving rejected');
    assert(q.commit('t1').ok, 't1 commits at its sequence');
    assert(q.admit('t2', ['x'], []).ok, 't2 admissible once the conflict cleared');
    assert(eq(q.schedule(), ['t1']), 'committed serial order recorded');
  });

  // ── P8: Policy engine + approval/risk gates (rules 30, 34) ────────────────────
  G('CSE P8 · Policy engine');

  t('policy allows/denies (deny overrides) and gates irreversible actions on approval', () => {
    const pe = new PolicyEngine({ version: 'policy-8', rules: [
      { id: 'allow-edit', when: (c) => c.action === 'edit', effect: DECISION.ALLOW },
      { id: 'deny-system', when: (c) => c.object === 'system', effect: DECISION.DENY },
      { id: 'delete-irrev', when: (c) => c.action === 'delete', effect: DECISION.ALLOW, risk: RISK_LEVEL.IRREVERSIBLE },
    ] });
    assert(pe.evaluate({ action: 'edit', object: 'file' }).allowed, 'allowed action passes');
    assert(!pe.evaluate({ action: 'edit', object: 'system' }).allowed, 'deny overrides allow');
    const del = pe.evaluate({ action: 'delete', object: 'file' });
    assert(!del.allowed && del.requiresApproval && del.risk === RISK_LEVEL.IRREVERSIBLE, 'irreversible action needs approval');
    assert(pe.evaluate({ action: 'delete', object: 'file' }, { isApproved: () => true }).allowed, 'approved irreversible action allowed');
    assert(pe.evaluate({ action: 'unknown' }).decision === DECISION.DENY, 'default deny when no rule matches');
  });

  // ── P8: Encryption & retention — cryptographic erase (rule 62) ────────────────
  G('CSE P8 · Retention');

  t('cryptographic erase makes payloads unrecoverable while audit metadata survives', () => {
    const rm = new RetentionManager();
    rm.createScope('user.42');
    const env = rm.seal('user.42', 'SECRET-SSN', { kind: 'pii', subject: 'user.42' });
    assert(rm.open(env) === 'SECRET-SSN', 'sealed payload opens while the key is live');
    assert(env.audit.kind === 'pii', 'non-sensitive audit metadata is retained');
    rm.cryptoErase('user.42');
    assert(rm.open(env) === null, 'destroying the key renders the payload irrecoverable');
    assert(env.audit.kind === 'pii', 'audit metadata survives cryptographic erase');
  });

  // ── P8: Garbage collection — never collects pinned state (rule 61) ────────────
  G('CSE P8 · Garbage collection');

  t('GC collects only unreachable, unpinned objects', () => {
    const gc = new GarbageCollector();
    gc.register('checkpoint', ['stateRoot']);
    gc.register('stateRoot', ['v15']);
    gc.register('v15', []);
    gc.register('v14', []);                       // old, unreferenced
    gc.register('pinnedAudit', [], { pinned: true }); // unreferenced but pinned
    gc.addRoot('checkpoint');
    assert(eq(gc.collectable(), ['v14']), 'only unreachable + unpinned is collectable');
    gc.sweep();
    assert(!gc.has('v14') && gc.has('v15') && gc.has('pinnedAudit'), 'sweep keeps reachable + pinned, drops dead');
  });

  // ── P8: Causal dynamics model (rules 47–49) ───────────────────────────────────
  G('CSE P8 · Causal dynamics');

  t('declared dynamics predict next state, never guess unknown actions, and calibrate', () => {
    const cd = new CausalDynamics();
    cd.declare('move', (s, p) => ({ ...s, x: s.x + p.dx }), { effects: { moved: true }, confidence: 0.6 });
    const before = { x: 0 };
    const pred = cd.predict(before, 'move', { dx: 5 });
    assert(pred.known && pred.predictedState.x === 5 && before.x === 0, 'predicts without mutating input');
    assert(!cd.predict({ x: 0 }, 'teleport', {}).known, 'unknown action is not guessed');
    cd.learn('move', 0); // perfectly accurate observation
    assert(cd.confidenceOf('move') > 0.6, 'accurate outcomes raise calibrated confidence');
  });

  // ── P8: Fault injection (rule 68) ─────────────────────────────────────────────
  G('CSE P8 · Fault injection');

  t('duplicate delivery is absorbed (no double effect)', () => {
    const outbox = new Outbox();
    const intent = makeEffectIntent({ kind: 'pay' });
    outbox.record(intent); outbox.record(intent); outbox.record(intent);
    assert(outbox.size === 1, 'duplicates collapse to a single effect');
  });

  t('message reordering: state-based merge converges regardless of order', () => {
    const a = new PNCounter().increment('a', 3);
    const b = new PNCounter().increment('b', 2).decrement('b', 1);
    assert(a.merge(b).value() === b.merge(a).value(), 'reordered merges converge to the same value');
  });

  t('crash + recovery: a downed replica rejoins and catches up to the committed log', () => {
    const raft = new RaftAdapter(['n0', 'n1', 'n2']);
    raft.electLeader(); raft.propose('a');
    const f = ['n0', 'n1', 'n2'].find((n) => n !== raft.leader);
    raft.crash(f); raft.propose('b'); raft.recover(f);
    assert(eq(raft.committedOn(f), ['a', 'b']), 'recovered replica converges to the committed log');
  });

  // ── Integration — all planes compose end-to-end ───────────────────────────────
  // One transaction flows: proposal pool (compete) → policy gate → commit
  // coordinator (USO consume/create + outbox intent + witness) → replicated log
  // (Raft quorum) → quorum-finalized checkpoint over the committed state root.
  G('CSE · Integration (end-to-end)');

  await ta('a transaction flows proposal → policy → commit → outbox → replication → checkpoint', async () => {
    // Exclusive state + reliability + transaction planes.
    const reg = new USORegistry();
    reg.create(objectVersionOutput('doc', 1));
    const outbox = new Outbox();
    const coord = createCommitCoordinator({ usoRegistry: reg, outbox, authority: 'server-primary' });

    // Two agents propose spending the SAME version — only one may win (Plane 5).
    const mkProposal = (actor) => sealTransactionFast(makeTransaction({
      actorID: actor,
      consumeSet: ['object-version:doc:1'],
      createSet: ['object-version:doc:2'],
      externalEffectIntents: [makeEffectIntent({ kind: 'doc.publish', payload: { doc: 'doc', v: 2 } })],
    }));
    const pa = mkProposal('agent.a');
    const pb = mkProposal('agent.b');
    const pool = new ProposalPool();
    pool.submit(pa); pool.submit(pb);
    const { winners, superseded } = pool.resolve();
    assert(winners.length === 1 && superseded.length === 1, 'exactly one proposal wins the contested input');
    const winner = winners[0];

    // Authority plane: policy must allow the action before commit (Plane 6).
    const policy = new PolicyEngine({ version: 'policy-1', rules: [
      { id: 'allow-publish', when: (c) => c.action === 'doc.publish', effect: DECISION.ALLOW },
    ] });
    assert(policy.evaluate({ action: 'doc.publish', object: 'doc' }).allowed, 'policy permits the winning action');

    // Transaction plane: atomic commit (consume→create + outbox + witness).
    const r = await coord.commit(new FactStore([]), winner, { outputs: [objectVersionOutput('doc', 2)] });
    assert(r.ok && r.receipt.decision === 'committed', 'winner commits atomically with a witness receipt');
    assert(reg.isUnspent('object-version:doc:2') && !reg.isUnspent('object-version:doc:1'), 'USO consumed→created');
    assert(outbox.pending().length === 1, 'external effect parked in the transactional outbox');

    // Replication plane: the committed tx replicates to a quorum (Plane 11).
    const raft = new RaftAdapter(['n0', 'n1', 'n2']);
    assert(raft.electLeader().ok, 'cluster elects a leader');
    const rep = raft.propose(r.receipt.transactionID);
    assert(rep.committed, 'commit replicated to a quorum');

    // Integrity plane: a checkpoint over the committed state root is quorum-finalized (Plane 8).
    const cp = makeCheckpoint({ eventRangeRoot: r.receipt.transactionID, stateRoot: r.receipt.postStateRoot, unspentRoot: 'uso-doc-2' });
    const cq = new CheckpointQuorum({ members: ['n0', 'n1', 'n2'] });
    cq.propose(cp);
    cq.attest(cp.id, 'n0', cp.stateRoot);
    cq.attest(cp.id, 'n1', cp.stateRoot);
    assert(cq.isFinalized(cp.id), 'checkpoint finalized by a quorum over the committed state root');

    // The loser never overwrote anything and cannot now double-spend the input.
    assert(pool.status(superseded[0].transactionID) === PROPOSAL_STATUS.SUPERSEDED, 'loser superseded, not committed');
    const replay = await coord.commit(new FactStore([]), superseded[0], { outputs: [objectVersionOutput('doc', 2)] });
    assert(!replay.ok, 'the superseded proposal cannot double-spend the consumed input');
  });

  // ── P9: Production crypto — AES-256-GCM retention (§13, rule 62) ──────────────
  G('CSE P9 · Secure crypto');

  await ta('AES-GCM retention round-trips and fails closed on tampering', async () => {
    if (!secureCryptoAvailable()) return; // environment without WebCrypto — skipped
    const rm = new SecureRetentionManager();
    await rm.createScope('user.7');
    const env = await rm.seal('user.7', 'TOP-SECRET', { kind: 'pii' });
    assert(await rm.open(env) === 'TOP-SECRET', 'authenticated decryption round-trips');
    const flipped = env.ciphertext.slice(0, -1) + (env.ciphertext.slice(-1) === '0' ? '1' : '0');
    assert(await rm.open({ ...env, ciphertext: flipped }) === null, 'GCM auth tag rejects tampered ciphertext');
    assert(env.audit.kind === 'pii', 'non-sensitive audit metadata retained');
  });

  await ta('AES-GCM cryptographic erase makes payloads unrecoverable', async () => {
    if (!secureCryptoAvailable()) return;
    const rm = new SecureRetentionManager();
    await rm.createScope('s1');
    const env = await rm.seal('s1', 'SECRET');
    rm.cryptoErase('s1');
    assert(await rm.open(env) === null, 'destroying the AES key renders the payload irrecoverable');
  });

  // ── P9: Byzantine fault tolerance — hostile-P2P profile (rule 38) ─────────────
  G('CSE P9 · Byzantine fault tolerance');

  t('BFT commits a value only with a 2f+1 quorum', () => {
    const bft = new ByzantineAdapter(['n0', 'n1', 'n2', 'n3'], 1); // n=4, f=1, quorum=3
    bft.vote(1, 'n0', 'A'); bft.vote(1, 'n1', 'A');
    assert(!bft.isCommitted(1, 'A'), '2 votes < quorum of 3');
    bft.vote(1, 'n2', 'A');
    assert(bft.isCommitted(1, 'A') && bft.committedValue(1) === 'A', '2f+1 matching votes commit');
  });

  t('an equivocating node is detected and its votes discarded', () => {
    const bft = new ByzantineAdapter(['n0', 'n1', 'n2', 'n3'], 1);
    bft.vote(1, 'n0', 'A');
    const eq = bft.vote(1, 'n0', 'B'); // same node, same round, conflicting value
    assert(eq.equivocation, 'double-voting is detected as equivocation');
    assert(bft.byzantineNodes().includes('n0'), 'the node is flagged Byzantine');
    assert(bft.tally(1, 'A') === 0, 'a Byzantine node cannot help any value reach quorum');
  });

  t('construction requires n ≥ 3f+1', () => {
    let threw = false;
    try { new ByzantineAdapter(['a', 'b', 'c'], 1); } catch (_) { threw = true; } // n=3 < 4
    assert(threw, 'insufficient membership for the fault bound is rejected');
  });

  // ── P9: Executable model check (TLC-equivalent, §19 rule 66) ──────────────────
  G('CSE P9 · Model check');

  t('exhaustive exploration: no-double-spend / single-spend / every-commit-witnessed hold', () => {
    const res = exploreCommitMachine({
      outputs: ['o1'],
      txns: ['t1', 't2'],
      consume: { t1: ['o1'], t2: ['o1'] }, // both contend for the same input
      create: { t1: ['o2'], t2: ['o3'] },
    });
    assert(res.ok && res.violation === null, `safety invariants hold across ${res.statesExplored} reachable states`);
    assert(res.statesExplored >= 3 && !res.truncated, 'explored the full reachable state space');
  });

  return results;
}

async function render() {
  const start = performance.now();
  const results = await runAll();
  const ms = (performance.now() - start).toFixed(2);
  const pass = results.filter((r) => r.status === 'PASS').length;
  const fail = results.length - pass;

  document.getElementById('pill-total').textContent = `${results.length} gates`;
  document.getElementById('pill-pass').textContent = `${pass} passed`;
  document.getElementById('pill-fail').textContent = `${fail} failed`;
  document.getElementById('pill-fail').classList.toggle('ok', fail === 0);
  document.getElementById('pill-fail').classList.toggle('bad', fail !== 0);
  document.getElementById('time').textContent = `${URC_FULL} · ran in ${ms} ms`;

  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  let lastGroup = null;
  for (const r of results) {
    if (r.group !== lastGroup) {
      lastGroup = r.group;
      const gr = document.createElement('tr');
      gr.innerHTML = `<td></td><td class="grp" colspan="2">${r.group}</td>`;
      rows.appendChild(gr);
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="s ${r.status}">${r.status}</td><td>${r.name}</td>` +
      `<td class="detail">${r.detail ? r.detail : ''}</td>`;
    rows.appendChild(tr);
  }
}

document.getElementById('rerun').addEventListener('click', render);
render();
</script>
