<script type="module">
import {
  packPattern, unpackPattern, canonicalId, hammingDistance, symmetries,
  PatternCodebook, patternHashId, PATTERN_COUNT,
} from './codebook/PatternCodebook.js';
import { makeCodeEntry } from './codebook/CodeEntry.js';
import { symbolicSig, sigEquals, sigContains, primeAt, PRIME_TABLE } from './codebook/SymbolicSig.js';
import { canonicalSetHash, hashFactString } from './util/hashing.js';
import { URC_FULL, urcVersionStamp } from './version.js';
import {
  spatialId2D, fromSpatialId2D, spatialId3D, fromSpatialId3D,
  hilbertId2D, chunkId2D, neighbors2D,
} from './spatial/SpatialCode.js';
import { walshHadamard, dct2D, idct2D } from './resonance/Transforms.js';
import { resonanceWHT, cosineSimilarity, nearestAttractor } from './resonance/ResonanceVector.js';
import { fact, revoke, isTombstone } from './facts/Fact.js';
import { FactStore } from './facts/FactStore.js';
import { constraint, validateFacts, atMostOne, mutuallyExclusive, SCOPE_COMMIT } from './facts/Constraints.js';
import { commutes, branchOrders, mergeEquivalent, prune } from './facts/Branch.js';
import { link, toposort, dependsOn } from './facts/Causality.js';
import { makeWitness } from './witness/Witness.js';
import { TIME_MODES, createTimeSource } from './time/TimeModel.js';
import { createCommitGate } from './commit/CommitGate.js';
import { CORRECTION_TIERS, CORRECTION_ACTIONS, correct } from './commit/CorrectionGate.js';
import { projectSequence, chooseBranch } from './observer/Projection.js';
// ── Causal State Engine (P1/P2) ──────────────────────────────────────────────
import { canonicalize, hashIdFast, hashIdSecure, parseHashId } from './util/canonical.js';
import { makeTransaction, sealTransactionFast } from './transaction/Transaction.js';
import { IdempotencyRegistry } from './transaction/Idempotency.js';
import { createCommitCoordinator } from './transaction/CommitCoordinator.js';
import { objectVersionOutput } from './uso/USO.js';
import { USORegistry } from './uso/USORegistry.js';
import { CausalGraph } from './causal/CausalParents.js';
import { EntityRegistry } from './entity/EntityRegistry.js';
import { CERTAINTY, makeProvenance, isUntrusted } from './entity/ProvenanceStore.js';
import { makeCapability, attenuate, authorizes } from './authority/Capability.js';
import { CapabilityRegistry } from './authority/CapabilityRegistry.js';
import { EventLog } from './integrity/EventLog.js';
import { computeStateRoot } from './integrity/StateRoot.js';
import { makeCheckpoint, verifyCheckpoint } from './integrity/Checkpoint.js';
import { FencingDomain } from './time/Fencing.js';
// ── Causal State Engine (P3 · Workflow / reliability) ────────────────────────
import { EFFECT_STATUS, makeEffectIntent, Outbox } from './workflow/Outbox.js';
import { Inbox } from './workflow/Inbox.js';
import { SAGA_STATUS, sagaStep, Saga } from './workflow/Saga.js';
import { RECONCILE_RESULT, Reconciler } from './workflow/Reconciler.js';
import { ReservationManager, BoundedCounterEscrow } from './consistency/Reservation.js';
// ── Causal State Engine (P4 · Safe concurrency) ──────────────────────────────
import { GCounter, PNCounter, GSet, ORSet, LWWRegister } from './consistency/CRDT.js';
import { classifyConfluence } from './consistency/InvariantConfluence.js';
import { OptimisticValidator, detectWriteSkew } from './consistency/OptimisticValidator.js';
import { ORDER, VersionVector, DVVSet } from './causal/DottedVersionVector.js';
import { HLC, compareHLC } from './causal/HLC.js';
// ── Causal State Engine (P5 · AI World Model) ────────────────────────────────
import { WORLD, BeliefStore } from './worldmodel/BeliefStore.js';
import { RELATION, ObjectGraph } from './worldmodel/ObjectGraph.js';
import { RISK, AffordanceRegistry } from './worldmodel/AffordanceRegistry.js';
import { ToolEffectModel } from './worldmodel/ToolEffectModel.js';
import { PredictionSandbox } from './worldmodel/PredictionSandbox.js';
import { ingestUntrusted, canAuthorize, UntrustedBoundary } from './worldmodel/UntrustedBoundary.js';
// ── Causal State Engine (P6 · Distributed authority) ─────────────────────────
import { ShardRouter } from './replication/ShardRouter.js';
import { ReplicatedLog } from './replication/ReplicatedLog.js';
import { RaftAdapter } from './replication/RaftAdapter.js';
import { CrossShardCoordinator } from './replication/CrossShardCoordinator.js';
import { CheckpointQuorum } from './replication/CheckpointQuorum.js';
// ── Causal State Engine (P7 · Simulation & resonance) ────────────────────────
import { SimulationClock, SimulationClockSet } from './time/SimulationClock.js';
import { WorldDynamics } from './sim/WorldDynamics.js';
import { ResonanceIndex } from './perception/ResonanceIndex.js';
// ── Causal State Engine (P8 · Completeness pass) ─────────────────────────────
import { PROPOSAL_STATUS, ProposalPool } from './transaction/ProposalPool.js';
import { SerializableQueue } from './consistency/SerializableQueue.js';
import { RISK_LEVEL, DECISION, PolicyEngine } from './authority/PolicyEngine.js';
import { RetentionManager } from './integrity/Retention.js';
import { GarbageCollector } from './integrity/GarbageCollector.js';
import { CausalDynamics } from './worldmodel/CausalDynamics.js';
// ── Causal State Engine (P9 · Hardening: crypto / BFT / model check) ─────────
import { secureCryptoAvailable } from './integrity/SecureCrypto.js';
import { SecureRetentionManager } from './integrity/SecureRetention.js';
import { ByzantineAdapter } from './replication/ByzantineAdapter.js';
import { exploreCommitMachine } from './verify/ModelCheck.js';

async function runAll() {
  const results = [];
  let group = '';
  const G = (name) => { group = name; };
  const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const assert = (cond, msg) => { if (!cond) throw new Error(msg || 'assertion failed'); };
  const t = (name, fn) => {
    try { fn(); results.push({ group, name, status: 'PASS' }); }
    catch (e) { results.push({ group, name, status: 'FAIL', detail: e?.message ?? String(e) }); }
  };
  const ta = async (name, fn) => {
    try { await fn(); results.push({ group, name, status: 'PASS' }); }
    catch (e) { results.push({ group, name, status: 'FAIL', detail: e?.message ?? String(e) }); }
  };

  // ── M1: Codebook ──────────────────────────────────────────────────────────
  G('M1 · Codebook');

  t('pack/unpack round-trips for all 512 patterns', () => {
    for (let id = 0; id < PATTERN_COUNT; id++) {
      const cells = unpackPattern(id);
      assert(packPattern(cells) === id, `mismatch at ${id}`);
    }
  });

  t('canonicalId is invariant under all 8 dihedral symmetries', () => {
    for (let id = 0; id < PATTERN_COUNT; id++) {
      const c = canonicalId(id);
      for (const s of symmetries(id)) {
        assert(canonicalId(s) === c, `symmetry ${s} of ${id} -> ${canonicalId(s)} != ${c}`);
      }
    }
  });

  t('canonical id is the minimum over symmetries (stable representative)', () => {
    const c = canonicalId(0b000000111); // bottom row
    assert(symmetries(0b000000111).every((s) => s >= c), 'canonical not minimal');
  });

  t('hammingDistance counts differing cells', () => {
    assert(hammingDistance(0b000000000, 0b000000000) === 0, 'zero distance');
    assert(hammingDistance(0b000000000, 0b000000111) === 3, 'three bits');
    assert(hammingDistance(0b101010101, 0b010101010) === 9, 'all nine differ');
  });

  t('codebook dense ids: a pattern and its rotations share one dense id', () => {
    const cb = new PatternCodebook();
    const base = 0b000000111;
    const d0 = cb.denseId(base);
    for (const s of symmetries(base)) assert(cb.denseId(s) === d0, 'rotation got a new dense id');
    assert(cb.size === 1, `expected 1 entry, got ${cb.size}`);
  });

  t('nearestLegal snaps corrupted input to the nearest legal attractor', () => {
    const cb = new PatternCodebook();
    const full = 0b111111111, empty = 0b000000000;
    cb.registerLegal(full);
    cb.registerLegal(empty);
    const exact = cb.nearestLegal(full);
    assert(exact && exact.distance === 0, 'exact legal should be distance 0');
    const corrupted = cb.nearestLegal(0b111111110); // 1 bit off "full"
    assert(corrupted && corrupted.distance === 1, `expected distance 1, got ${corrupted?.distance}`);
    assert(canonicalId(corrupted.canonicalId) === canonicalId(full), 'snapped to wrong attractor');
  });

  t('nearestLegal returns null when no legal attractors exist', () => {
    assert(new PatternCodebook().nearestLegal(0b101010101) === null, 'expected null');
  });

  t('patternHashId is deterministic and rotation-stable', () => {
    const a = patternHashId(0b000000111);
    const b = patternHashId(0b100100100); // a rotation of the row
    assert(a === b, 'hash id should match across symmetries');
    assert(typeof a === 'string' && a.length > 0, 'hash id should be a hex string');
  });

  // ── M1: Symbolic signatures (meaning, not identity) ─────────────────────────
  G('M1 · Symbolic');

  t('symbolicSig sorts + de-duplicates prime indices', () => {
    const sig = symbolicSig([5, 1, 5, 3, 1]);
    assert(eq(sig.indices, [1, 3, 5]), `got ${JSON.stringify(sig.indices)}`);
  });

  t('sigEquals compares index sets, not products', () => {
    assert(sigEquals(symbolicSig([2, 7]), symbolicSig([7, 2])), 'order should not matter');
    assert(!sigEquals(symbolicSig([2, 7]), symbolicSig([2, 8])), 'different meaning');
  });

  t('sigContains checks symbolic containment', () => {
    assert(sigContains(symbolicSig([1, 2, 3]), symbolicSig([2, 3])), 'subset should be contained');
    assert(!sigContains(symbolicSig([1, 2]), symbolicSig([2, 3])), 'missing meaning');
  });

  t('primeAt maps indices to the prime table', () => {
    assert(primeAt(0) === 2 && primeAt(1) === 3 && primeAt(2) === 5, 'prime table mismatch');
    let threw = false; try { primeAt(PRIME_TABLE.length); } catch { threw = true; }
    assert(threw, 'out-of-range index should throw');
  });

  // ── M0: Layer-law invariants ────────────────────────────────────────────────
  G('M0 · Layer law');

  t('hash = identity: canonicalSetHash is ORDER-INDEPENDENT', () => {
    const h1 = canonicalSetHash(['hasKey(player,red)', 'door(open)']);
    const h2 = canonicalSetHash(['door(open)', 'hasKey(player,red)']);
    assert(h1 === h2, 'fact-set hash must not depend on order');
  });

  t('hash = identity: set hash de-duplicates facts (monotonic add)', () => {
    const h1 = canonicalSetHash(['a', 'b']);
    const h2 = canonicalSetHash(['a', 'b', 'b', 'a']);
    assert(h1 === h2, 'duplicate facts must not change identity');
  });

  t('similarity is NOT truth: nearestLegal reports distance, never asserts identity', () => {
    const cb = new PatternCodebook();
    cb.registerLegal(0b111111111);
    const snap = cb.nearestLegal(0b111111000); // 3 bits off
    // It SUGGESTS an attractor + distance; it does not claim the inputs are equal.
    assert(snap.distance === 3, 'must surface the real Hamming distance');
    assert(snap.canonicalId !== 0b111111000, 'must not rewrite input as the attractor');
  });

  t('CodeEntry keeps un-built layers explicitly null (no faked layers)', () => {
    const entry = makeCodeEntry(0b000000111);
    assert(entry.spatialID === null, 'spatial (M2) must be null until built');
    assert(entry.resonanceVector === null, 'resonance (M3) must be null until built');
    assert(entry.correctionCode === null, 'correction (M5) must be null until built');
    assert(typeof entry.exactID === 'number' && typeof entry.hashID === 'string', 'exact+hash present');
    assert(entry.version.codebookVersion === urcVersionStamp().codebookVersion, 'version stamp present');
  });

  t('fact string hashing is deterministic', () => {
    assert(hashFactString('damage(player,12)') === hashFactString('damage(player,12)'), 'unstable hash');
  });

  // ── M2: Spatial ─────────────────────────────────────────────────────────────
  G('M2 · Spatial');

  t('Morton 2D round-trips (spatialId ↔ coords)', () => {
    for (const [x, y] of [[0, 0], [1, 0], [0, 1], [13, 27], [255, 255]]) {
      const [dx, dy] = fromSpatialId2D(spatialId2D(x, y));
      assert(dx === x && dy === y, `(${x},${y}) -> (${dx},${dy})`);
    }
  });

  t('Morton 3D round-trips', () => {
    for (const [x, y, z] of [[0, 0, 0], [1, 2, 3], [10, 20, 30]]) {
      const [dx, dy, dz] = fromSpatialId3D(spatialId3D(x, y, z));
      assert(dx === x && dy === y && dz === z, `(${x},${y},${z}) -> (${dx},${dy},${dz})`);
    }
  });

  t('chunkId2D groups coords within a chunk and separates chunks', () => {
    const a = chunkId2D(3, 3, 16), b = chunkId2D(15, 0, 16), c = chunkId2D(16, 0, 16);
    assert(a === b, 'same chunk must share id');
    assert(a !== c, 'next chunk must differ');
  });

  t('neighbors2D returns orthogonal neighbors and clips negatives', () => {
    assert(neighbors2D(5, 5).length === 4, 'interior should have 4');
    assert(neighbors2D(0, 0).length === 2, 'origin should clip to 2');
    assert(neighbors2D(0, 0, { diagonal: true }).length === 3, 'origin diagonal should be 3');
  });

  t('Hilbert curve is a bijection over an 8×8 grid (cold-path locality)', () => {
    const n = 8, seen = new Set();
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const d = hilbertId2D(n, x, y);
      assert(d >= 0 && d < n * n, `out of range: ${d}`);
      assert(!seen.has(d), `duplicate distance: ${d}`);
      seen.add(d);
    }
    assert(seen.size === n * n, 'Hilbert mapping is not a permutation');
  });

  // ── M3: Resonance ─────────────────────────────────────────────────────────────
  G('M3 · Resonance');

  t('WHT is involutive up to length scale: WHT(WHT(v)) === n·v', () => {
    const v = [1, -1, 1, -1, 1, 1, -1, -1], n = v.length;
    const r = walshHadamard(walshHadamard(v));
    for (let i = 0; i < n; i++) assert(r[i] === n * v[i], `idx ${i}: ${r[i]} != ${n * v[i]}`);
  });

  t('WHT of a constant vector concentrates energy in coefficient 0', () => {
    const w = walshHadamard([1, 1, 1, 1]);
    assert(w[0] === 4, `DC should be 4, got ${w[0]}`);
    for (let i = 1; i < 4; i++) assert(w[i] === 0, `coeff ${i} should be 0`);
  });

  t('resonanceWHT is deterministic', () => {
    assert(eq(resonanceWHT(0b000000111), resonanceWHT(0b000000111)), 'unstable resonance vector');
  });

  t('cosineSimilarity: identical=1, opposite=-1, orthogonal=0', () => {
    assert(Math.abs(cosineSimilarity([1, 2, 3], [1, 2, 3]) - 1) < 1e-9, 'identical should be 1');
    assert(Math.abs(cosineSimilarity([1, 0], [-1, 0]) + 1) < 1e-9, 'opposite should be -1');
    assert(Math.abs(cosineSimilarity([1, 0], [0, 1])) < 1e-9, 'orthogonal should be 0');
  });

  t('nearestAttractor snaps a corrupted pattern to the right family (suggests, not asserts)', () => {
    const full = resonanceWHT(0b111111111), empty = resonanceWHT(0b000000000);
    const corrupted = resonanceWHT(0b111111110); // one cell flipped off "full"
    const r = nearestAttractor(corrupted, [full, empty]);
    assert(r.index === 0, 'corrupted-full should resemble FULL (index 0), not EMPTY');
  });

  t('DCT round-trips an 8×8 block within tolerance (idct(dct(x)) === x)', () => {
    const N = 8, block = new Float64Array(N * N);
    for (let i = 0; i < N * N; i++) block[i] = ((i * 37) % 17) - 8;
    const back = idct2D(dct2D(block, N), N);
    let maxErr = 0;
    for (let i = 0; i < N * N; i++) maxErr = Math.max(maxErr, Math.abs(back[i] - block[i]));
    assert(maxErr < 1e-6, `max reconstruction error ${maxErr}`);
  });

  t('DCT of a constant block puts all energy in the DC coefficient', () => {
    const N = 8, block = new Float64Array(N * N).fill(5);
    const co = dct2D(block, N);
    assert(Math.abs(co[0]) > 1e-6, 'DC should be non-zero');
    let acHi = 0;
    for (let i = 1; i < N * N; i++) acHi = Math.max(acHi, Math.abs(co[i]));
    assert(acHi < 1e-6, `AC coefficients should be ~0, got ${acHi}`);
  });

  // ── M4: Facts (monotonic store, tombstones, projection) ──────────────────────
  G('M4 · Facts');

  t('facts are monotonic: revoke adds a tombstone, never deletes', () => {
    const s = new FactStore();
    s.add(fact('hasKey', 'player', 'red'));
    s.revoke(fact('hasKey', 'player', 'red'));
    assert(s.has(fact('hasKey', 'player', 'red')), 'original fact must remain in history');
    assert(s.has(revoke(fact('hasKey', 'player', 'red'))), 'tombstone must be present');
    assert(!s.live().has(fact('hasKey', 'player', 'red')), 'revoked fact must not be live');
  });

  t('state id is order-independent; merge is commutative + idempotent', () => {
    const a = new FactStore([fact('door', 'open'), fact('hasKey', 'player', 'red')]);
    const b = new FactStore([fact('hasKey', 'player', 'red'), fact('door', 'open')]);
    assert(a.id() === b.id(), 'reordered facts must share state id');
    const m1 = a.clone().merge(b), m2 = b.clone().merge(a);
    assert(m1.id() === m2.id() && m1.id() === a.id(), 'merge must converge + be idempotent');
  });

  // ── M4: Branching (the headline gate) ────────────────────────────────────────
  G('M4 · Branch');

  // potion vs fatal damage: A=drink (+6, clamp 10), B=damage (-8, death at <=0)
  const getHp = (s) => { for (const f of s.live()) { const m = /^hp\((-?\d+)\)$/.exec(f); if (m) return +m[1]; } return 0; };
  const setHp = (s, v) => {
    s.revoke(`hp(${getHp(s)})`); s.add(`hp(${v})`);
    if (v <= 0) { s.add('dead'); s.revoke('alive'); }
  };
  const drink = (s) => setHp(s, Math.min(10, getHp(s) + 6));
  const damage = (s) => setHp(s, getHp(s) - 8);
  const baseHp5 = () => new FactStore(['alive', 'hp(5)']);

  t('non-commuting ops branch: drink⊕damage ≠ damage⊕drink', () => {
    const r = commutes(baseHp5(), drink, damage);
    assert(!r.commutes, 'potion vs fatal damage must NOT commute');
  });

  t('branchOrders yields two distinct survival/death outcomes', () => {
    const [ab, ba] = branchOrders(baseHp5(), drink, damage); // ab=drink→damage, ba=damage→drink
    assert(ab.live().has('alive') && !ab.live().has('dead'), 'drink-first should survive');
    assert(ba.live().has('dead') && !ba.live().has('alive'), 'damage-first should die');
    assert(ab.liveId() !== ba.liveId(), 'the two branches must be distinct states');
  });

  t('mergeEquivalent collapses identical branches only', () => {
    const [ab, ba] = branchOrders(baseHp5(), drink, damage);
    assert(mergeEquivalent([ab, ba]).length === 2, 'distinct branches stay separate');
    assert(mergeEquivalent([ab, ab.clone()]).length === 1, 'identical branches collapse');
  });

  // ── M4: Constraints + prune ──────────────────────────────────────────────────
  G('M4 · Constraints');

  const aliveXorDead = mutuallyExclusive('alive-xor-dead', 'alive', 'dead', { message: 'cannot be alive and dead' });
  const singleHp = atMostOne('single-hp', /^hp\(/, { scope: SCOPE_COMMIT, message: 'one hp source of truth' });

  t('validateFacts rejects a contradictory live set', () => {
    const broken = new FactStore(['alive', 'dead']);
    assert(!validateFacts(broken.live(), [aliveXorDead]).ok, 'alive+dead must fail');
    const ok = new FactStore(['alive', 'hp(3)']);
    assert(validateFacts(ok.live(), [aliveXorDead]).ok, 'valid set should pass');
  });

  t('commit constraints are stronger than runtime (phase gating)', () => {
    const twoHp = new FactStore(['hp(3)', 'hp(7)']).live();
    assert(validateFacts(twoHp, [singleHp], { phase: 'runtime' }).ok, 'runtime skips commit-only law');
    assert(!validateFacts(twoHp, [singleHp], { phase: 'commit' }).ok, 'commit enforces it');
  });

  t('prune drops branches that fail commit-strength constraints', () => {
    const good = new FactStore(['alive', 'hp(3)']);
    const bad = new FactStore(['alive', 'dead']);
    const kept = prune([good, bad], [aliveXorDead]);
    assert(kept.length === 1 && kept[0] === good, 'only the legal branch survives prune');
  });

  // ── M4: Causality (order only when forced) ───────────────────────────────────
  G('M4 · Causality');

  t('toposort orders only what dependencies force; independents stay deterministic', () => {
    const order = toposort(['B', 'A', 'C'], [link('A', 'B')]); // B depends on A; C free
    assert(order.indexOf('A') < order.indexOf('B'), 'A must precede B');
    assert(order.length === 3 && order.includes('C'), 'independent C still present');
  });

  t('toposort throws on a causal cycle (impossible order)', () => {
    let threw = false;
    try { toposort(['A', 'B'], [link('A', 'B'), link('B', 'A')]); } catch { threw = true; }
    assert(threw, 'cycle must be rejected');
  });

  t('dependsOn detects transitive causal dependency', () => {
    const links = [link('A', 'B'), link('B', 'C')];
    assert(dependsOn('C', 'A', links), 'C transitively depends on A');
    assert(!dependsOn('A', 'C', links), 'A does not depend on C');
  });

  // ── M4: Witness + Time ────────────────────────────────────────────────────────
  G('M4 · Witness & Time');

  t('makeWitness captures structured proof and is frozen', () => {
    const w = makeWitness({ inputFacts: ['alive', 'hp(5)'], rulesUsed: ['drink'], chosenProjection: 'survives', commitReason: 'player chose potion' });
    assert(Object.isFrozen(w), 'witness must be immutable');
    assert(w.inputFacts.length === 2 && w.commitReason === 'player chose potion', 'fields captured');
    assert(w.version.codebookVersion === urcVersionStamp().codebookVersion, 'version-stamped');
  });

  t('time is not a counter: NONE never advances', () => {
    const ts = createTimeSource(TIME_MODES.NONE);
    ts.step({ dt: 5, observed: true, irreversibleChange: 3 });
    assert(ts.now() === 0, 'timeless state must not progress');
  });

  t('OBSERVER time advances only when viewed; ENTROPIC is monotonic', () => {
    const obs = createTimeSource(TIME_MODES.OBSERVER);
    obs.step({ observed: false }); assert(obs.now() === 0, 'no view, no time');
    obs.step({ observed: true }); obs.step({ observed: true }); assert(obs.now() === 2, 'two views');
    const ent = createTimeSource(TIME_MODES.ENTROPIC);
    ent.step({ irreversibleChange: -4 }); ent.step({ irreversibleChange: 2 });
    assert(ent.now() === 6, 'entropy accumulates magnitude (irreversible, monotonic)');
  });

  // ── M5: Commit gates (only commit decides final truth) ───────────────────────
  G('M5 · Commit');

  const aliveXorDeadC = mutuallyExclusive('alive-xor-dead', 'alive', 'dead', { scope: SCOPE_COMMIT, message: 'cannot be alive and dead' });

  t('commit applies a delta to a clone and leaves the base untouched', () => {
    const gate = createCommitGate({ constraints: [aliveXorDeadC] });
    const base = new FactStore(['alive', 'hp(5)']);
    const r = gate.commit(base, { add: ['hasKey(player,red)'] }, { reason: 'pickup' });
    assert(r.ok && r.committed.live().has('hasKey(player,red)'), 'committed store has the new fact');
    assert(!base.live().has('hasKey(player,red)'), 'base must be unchanged (monotonic clone)');
    assert(r.witness.commitReason === 'pickup', 'witness records the commit reason');
  });

  t('commit REJECTS a delta that violates commit constraints', () => {
    const gate = createCommitGate({ constraints: [aliveXorDeadC] });
    const base = new FactStore(['alive', 'hp(5)']);
    const r = gate.commit(base, { add: ['dead'] }, { reason: 'kill' });
    assert(!r.ok && r.rejection === 'constraint', 'alive+dead commit must be rejected');
    assert(r.committed === null && r.witness.rejectedBranches.length > 0, 'no truth committed; witness explains');
  });

  t('commit enforces authority (e.g. ownership/signature)', () => {
    const owned = createCommitGate({ authority: (ctx) => ctx.owner === 'player' });
    const base = new FactStore(['inv(gold,10)']);
    assert(!owned.commit(base, { add: ['inv(gold,20)'] }, { context: { owner: 'thief' } }).ok, 'unauthorized must fail');
    const ok = owned.commit(base, { add: ['inv(gold,20)'] }, { context: { owner: 'player' }, reason: 'reward' });
    assert(ok.ok && ok.committed.live().has('inv(gold,20)'), 'authorized commit succeeds');
  });

  // ── M5: Correction tiers (correction is not authority) ───────────────────────
  G('M5 · Correction');

  t('VISUAL tier auto-corrects; SEMANTIC verifies; SECURITY never silently repairs', () => {
    const vis = correct({ tier: CORRECTION_TIERS.VISUAL, repaired: 'pixelsFixed' });
    assert(vis.action === CORRECTION_ACTIONS.APPLY, 'visual should auto-apply');

    const semOk = correct({ tier: CORRECTION_TIERS.SEMANTIC, repaired: 'invFixed', verify: () => true });
    const semBad = correct({ tier: CORRECTION_TIERS.SEMANTIC, repaired: 'invFixed', verify: () => false });
    assert(semOk.action === CORRECTION_ACTIONS.APPLY, 'verified semantic should apply');
    assert(semBad.action === CORRECTION_ACTIONS.QUARANTINE, 'unverified semantic must quarantine');

    const sec = correct({ tier: CORRECTION_TIERS.SECURITY, repaired: 'permsFixed', verify: () => true });
    assert(sec.action === CORRECTION_ACTIONS.REQUEST_AUTHORITY, 'security must escalate, never apply');
    assert(sec.value === null, 'security must not hand back a silently-repaired value');
  });

  t('unsure VISUAL branches instead of asserting', () => {
    const r = correct({ tier: CORRECTION_TIERS.VISUAL, repaired: 'maybe', unsure: true });
    assert(r.action === CORRECTION_ACTIONS.BRANCH, 'unsure should branch, not apply');
  });

  // ── M6: Observer projection (render order is not truth) ───────────────────────
  G('M6 · Observer');

  t('projectSequence yields an experienced order flagged isTruth:false', () => {
    const store = new FactStore(['A', 'B', 'C']);
    const proj = projectSequence(store, [link('A', 'B')]);
    assert(proj.isTruth === false, 'a projection must never claim to be truth');
    assert(proj.sequence.indexOf('A') < proj.sequence.indexOf('B'), 'causal order respected in the view');
  });

  t('branch is NOT commit: chooseBranch projects one path, others stay possible', () => {
    const [ab, ba] = branchOrders(baseHp5(), drink, damage); // reuse the state-reading potion/damage ops
    const survive = chooseBranch([ab, ba], () => 0);
    const die = chooseBranch([ab, ba], () => 1);
    assert(survive.isTruth === false && die.isTruth === false, 'chosen branches are projections, not truth');
    assert(survive.branch.liveId() !== die.branch.liveId(), 'different observers can experience different paths');
    assert(survive.witness.rejectedBranches.length === 1, 'unobserved branch recorded as still-possible');
  });

  t('observer order does not mutate canonical truth (only a CommitGate can)', () => {
    const base = new FactStore(['alive', 'hp(5)']);
    const before = base.id();
    chooseBranch([base.clone(), base.clone()], () => 1);
    projectSequence(base, []);
    assert(base.id() === before, 'projecting/choosing must not change the underlying state');
  });

  // ══ CAUSAL STATE ENGINE ══════════════════════════════════════════════════════

  // ── P1: Canonical serialization + tagged hash ids (§13) ───────────────────────
  G('CSE P1 · Canonical');

  t('canonicalize is key-order independent (RFC 8785-style)', () => {
    assert(canonicalize({ b: 1, a: 2 }) === canonicalize({ a: 2, b: 1 }), 'object key order must not matter');
    assert(canonicalize([1, 2, 3]) !== canonicalize([3, 2, 1]), 'array order MUST matter');
    assert(canonicalize(new Set(['b', 'a'])) === canonicalize(new Set(['a', 'b'])), 'set members order-independent');
  });

  t('hashIdFast is deterministic and self-describing (alg:bits:hex)', () => {
    const a = hashIdFast({ x: 1 }), b = hashIdFast({ x: 1 });
    assert(a === b, 'fast id must be stable');
    const p = parseHashId(a);
    assert(p && p.alg === 'fnv1a32' && p.bits === 32, `bad tag: ${a}`);
  });

  await ta('hashIdSecure uses Web Crypto SHA-256 and is deterministic', async () => {
    const a = await hashIdSecure({ x: 1 }), b = await hashIdSecure({ x: 1 });
    assert(a === b, 'secure id must be stable');
    const p = parseHashId(a);
    assert(p && p.alg === 'sha256' && p.bits === 256 && p.hex.length === 64, `bad tag: ${a}`);
  });

  // ── P1: Unspent State Outputs — single-spend / double-commit (§5,§19) ──────────
  G('CSE P1 · USO');

  t('USORegistry: create → unspent; applySpend → spent + new outputs', () => {
    const reg = new USORegistry();
    reg.create(objectVersionOutput('file.main', 14));
    assert(reg.isUnspent('object-version:file.main:14'), 'created output must be unspent');
    const r = reg.applySpend(['object-version:file.main:14'], [objectVersionOutput('file.main', 15)], 'tx-1');
    assert(r.ok && r.created[0] === 'object-version:file.main:15', 'spend should create replacement');
    assert(reg.isSpent('object-version:file.main:14') && reg.isUnspent('object-version:file.main:15'), 'state moved');
  });

  t('double-commit is detected: a spent output can never be spent again (§19)', () => {
    const reg = new USORegistry();
    reg.create(objectVersionOutput('file.main', 14));
    reg.applySpend(['object-version:file.main:14'], [objectVersionOutput('file.main', 15)], 'tx-1');
    const check = reg.checkSpendable(['object-version:file.main:14']);
    assert(!check.ok && check.reason === 'double-commit', 'second spend must be flagged double-commit');
    const dup = reg.checkSpendable(['object-version:file.main:15', 'object-version:file.main:15']);
    assert(!dup.ok, 'duplicate inputs in one request must be rejected');
  });

  // ── P1: The 14-step atomic commit protocol (§7) ───────────────────────────────
  G('CSE P1 · Commit protocol');

  await ta('a valid spend commits atomically, returns a witness receipt, pre≠post root', async () => {
    const reg = new USORegistry();
    reg.create(objectVersionOutput('file.main', 14));
    const coord = createCommitCoordinator({ usoRegistry: reg, authority: 'test-primary' });
    const base = new FactStore(['alive']);
    const env = sealTransactionFast(makeTransaction({
      actorID: 'agent.builder',
      consumeSet: ['object-version:file.main:14'],
      createSet: ['object-version:file.main:15'],
    }));
    const r = await coord.commit(base, env, { outputs: [objectVersionOutput('file.main', 15)] });
    assert(r.ok && r.receipt.decision === 'committed', `commit failed: ${r.receipt.rejection}`);
    assert(r.receipt.preStateRoot !== r.receipt.postStateRoot, 'state root must advance');
    assert(eq([...r.receipt.created], ['object-version:file.main:15']), 'receipt lists created outputs');
    assert(reg.isSpent('object-version:file.main:14'), 'input consumed');
  });

  await ta('coordinator rejects a second spend of the same input (no double-commit)', async () => {
    const reg = new USORegistry();
    reg.create(objectVersionOutput('file.main', 14));
    const coord = createCommitCoordinator({ usoRegistry: reg });
    const base = new FactStore([]);
    const mk = (v) => sealTransactionFast(makeTransaction({
      actorID: 'a', consumeSet: ['object-version:file.main:14'], createSet: [`object-version:file.main:${v}`],
    }));
    const r1 = await coord.commit(base, mk(15), { outputs: [objectVersionOutput('file.main', 15)] });
    const r2 = await coord.commit(base, mk(16), { outputs: [objectVersionOutput('file.main', 16)] });
    assert(r1.ok, 'first spend should succeed');
    assert(!r2.ok && r2.receipt.rejection === 'double-commit', 'second spend must be rejected');
  });

  await ta('createSet must match the supplied outputs exactly', async () => {
    const reg = new USORegistry();
    reg.create(objectVersionOutput('file.main', 1));
    const coord = createCommitCoordinator({ usoRegistry: reg });
    const env = sealTransactionFast(makeTransaction({
      actorID: 'a', consumeSet: ['object-version:file.main:1'], createSet: ['object-version:file.main:2'],

    const r = await coord.commit(new FactStore([]), env, { outputs: [objectVersionOutput('file.main', 999)] });
    assert(!r.ok && r.receipt.rejection === 'create-set-mismatch', 'mismatched outputs must be rejected');

  await ta('a tampered transaction id is rejected (canonical hash check)', async () => {
    const reg = new USORegistry();
    const coord = createCommitCoordinator({ usoRegistry: reg });
    const env = sealTransactionFast(makeTransaction({ actorID: 'a' }));
    const tampered = { ...env, transactionID: 'fnv1a32:32:deadbeef' };
    const r = await coord.commit(new FactStore([]), tampered, {});
    assert(!r.ok && r.receipt.rejection === 'bad-transaction-id', 'tampered id must be rejected');
  });

  await ta('a commit invariant violation is rejected with a witness (§19)', async () => {
    const reg = new USORegistry();
    const aliveXorDead = mutuallyExclusive('alive-xor-dead', 'alive', 'dead', { scope: SCOPE_COMMIT });
    const coord = createCommitCoordinator({ usoRegistry: reg, invariants: [aliveXorDead] });
    const env = sealTransactionFast(makeTransaction({ actorID: 'a' }));
    const r = await coord.commit(new FactStore(['alive']), env, { factDelta: { add: ['dead'] } });
    assert(!r.ok && r.receipt.rejection === 'invariant', 'alive+dead must violate the invariant');
    assert(r.receipt.violations.length > 0, 'rejection witness must explain the violation');
  });

  // ── P1: Idempotency (§19, rule 21) ────────────────────────────────────────────
  G('CSE P1 · Idempotency');

  await ta('replaying an idempotency key returns the original receipt, never repeats', async () => {
    const reg = new USORegistry();
    reg.create(objectVersionOutput('file.main', 1));
    const idem = new IdempotencyRegistry();
    const coord = createCommitCoordinator({ usoRegistry: reg, idempotency: idem });
    const env = sealTransactionFast(makeTransaction({
      actorID: 'a', idempotencyKey: 'a:edit:1',
      consumeSet: ['object-version:file.main:1'], createSet: ['object-version:file.main:2'],
    }));
    const r1 = await coord.commit(new FactStore([]), env, { outputs: [objectVersionOutput('file.main', 2)] });
    const r2 = await coord.commit(new FactStore([]), env, { outputs: [objectVersionOutput('file.main', 2)] });
    assert(r1.ok && !r1.replayed, 'first commit applies');
    assert(r2.replayed && r2.receipt === r1.receipt, 'replay returns the SAME receipt (no repeated effect)');
    assert(idem.size === 1, 'only one effect recorded');
  });

  // ── P1: Causal parents (§2,§9) ────────────────────────────────────────────────
  G('CSE P1 · Causal');

  await ta('a transaction with unknown causal parents is rejected', async () => {
    const reg = new USORegistry();
    const causal = new CausalGraph();
    const coord = createCommitCoordinator({ usoRegistry: reg, causal });
    const env = sealTransactionFast(makeTransaction({ actorID: 'a', causalParents: ['commit-does-not-exist'] }));
    const r = await coord.commit(new FactStore([]), env, {});
    assert(!r.ok && r.receipt.rejection === 'unknown-causal-parents', 'dangling parents must be rejected');
  });

  await ta('committed transactions become known causal parents', async () => {
    const reg = new USORegistry();
    const causal = new CausalGraph();
    const coord = createCommitCoordinator({ usoRegistry: reg, causal });
    const env1 = sealTransactionFast(makeTransaction({ actorID: 'a' }));
    const r1 = await coord.commit(new FactStore([]), env1, {});
    assert(r1.ok && causal.has(env1.transactionID), 'committed id must be recorded in the causal graph');
    const env2 = sealTransactionFast(makeTransaction({ actorID: 'a', causalParents: [env1.transactionID] }));
    const r2 = await coord.commit(new FactStore([]), env2, {});
    assert(r2.ok, 'a tx depending on a known parent should commit');
    assert(causal.dependsOn(env2.transactionID, env1.transactionID), 'partial order recorded');
  });

  // ── P1: Fencing tokens (§9, rule 12) ──────────────────────────────────────────
  G('CSE P1 · Fencing');

  t('fencing tokens are strictly monotonic; stale tokens are rejected by the resource', () => {
    const fz = new FencingDomain();
    const t1 = fz.issue(), t2 = fz.issue();
    assert(t2 > t1, 'tokens must strictly increase');
    assert(fz.accept(t2).ok, 'accept newest token');
    assert(!fz.check(t1).ok && fz.check(t1).reason === 'stale-fencing-token', 'older token now stale');
  });

  await ta('coordinator rejects a stale fencing token (lease ≠ authority)', async () => {
    const reg = new USORegistry();
    reg.create(objectVersionOutput('r', 1));
    const fz = new FencingDomain();
    const coord = createCommitCoordinator({ usoRegistry: reg, fencing: fz });
    const env1 = sealTransactionFast(makeTransaction({ actorID: 'a', consumeSet: ['object-version:r:1'], createSet: ['object-version:r:2'] }));
    const r1 = await coord.commit(new FactStore([]), env1, { outputs: [objectVersionOutput('r', 2)], fencingToken: 5 });
    assert(r1.ok && fz.accepted === 5, 'fresh token accepted on commit');
    const env2 = sealTransactionFast(makeTransaction({ actorID: 'a', consumeSet: ['object-version:r:2'], createSet: ['object-version:r:3'] }));
    const r2 = await coord.commit(new FactStore([]), env2, { outputs: [objectVersionOutput('r', 3)], fencingToken: 5 });
    assert(!r2.ok && r2.receipt.rejection === 'stale-fencing-token', 'stale token must not mutate protected state');
  });

  // ── P2: Versioned entity state (§4) ───────────────────────────────────────────
  G('CSE P2 · Entities');

  t('entities are immutable versions with stable logical ids; conflicts are caught', () => {
    const reg = new EntityRegistry();
    const v0 = reg.createEntity('npc.1', { hp: 5 });
    assert(reg.head('npc.1') === v0.versionID, 'head points at first version');
    const good = reg.putVersion('npc.1', { hp: 3 }, v0.versionID);
    assert(good.ok && reg.head('npc.1') === good.version.versionID, 'optimistic update advances head');
    const stale = reg.putVersion('npc.1', { hp: 1 }, v0.versionID); // expected the OLD head
    assert(!stale.ok && stale.reason === 'version-conflict', 'stale expected-version must conflict');
  });

  await ta('commit readSet enforces expected versions (write-skew guard)', async () => {
    const reg = new USORegistry();
    const ents = new EntityRegistry();
    const v0 = ents.createEntity('npc.1', { hp: 5 });
    const coord = createCommitCoordinator({ usoRegistry: reg, entities: ents });
    const bad = sealTransactionFast(makeTransaction({ actorID: 'a', readSet: [{ entity: 'npc.1', expectedVersion: 'WRONG' }] }));
    const rBad = await coord.commit(new FactStore([]), bad, {});
    assert(!rBad.ok && rBad.receipt.rejection === 'version-conflict', 'wrong expected version must be rejected');
    const ok = sealTransactionFast(makeTransaction({ actorID: 'a', readSet: [{ entity: 'npc.1', expectedVersion: v0.versionID }] }));
    const rOk = await coord.commit(new FactStore([]), ok, {});
    assert(rOk.ok, 'matching expected version should pass');
  });

  // ── P2: Capability authority (§6,§12) ─────────────────────────────────────────
  G('CSE P2 · Authority');

  t('capabilities authorize by principal/object/action; attenuation only narrows', () => {
    const cap = makeCapability({ principal: 'agent.builder', object: 'file.main', action: 'edit-file' });
    assert(authorizes(cap, { principal: 'agent.builder', object: 'file.main', action: 'edit-file' }).ok, 'matching request allowed');
    assert(!authorizes(cap, { principal: 'intruder', object: 'file.main', action: 'edit-file' }).ok, 'principal mismatch denied');
    const narrowed = attenuate(cap, { key: 'only-tuesday', predicate: (ctx) => ctx.day === 'tue' });
    assert(!authorizes(narrowed, { principal: 'agent.builder', object: 'file.main', action: 'edit-file', context: { day: 'wed' } }).ok, 'caveat must hold');
    assert(narrowed.id !== cap.id, 'attenuation produces a new, narrower capability');
  });

  await ta('commit requires a valid capability and rejects a revoked one (§19)', async () => {
    const reg = new USORegistry();
    const caps = new CapabilityRegistry();
    const cap = makeCapability({ principal: 'agent.builder', object: 'file.main', action: 'edit-file' });
    caps.issue(cap);
    const coord = createCommitCoordinator({ usoRegistry: reg, capabilities: caps });
    const mk = () => sealTransactionFast(makeTransaction({ actorID: 'agent.builder', capabilities: [cap.id] }));
    const ctx = { object: 'file.main', action: 'edit-file' };
    const r1 = await coord.commit(new FactStore([]), mk(), { context: ctx });
    assert(r1.ok, `valid capability should authorize: ${r1.receipt.rejection}`);

    assert(!r2.ok && r2.receipt.rejection === 'capability:revoked', 'revoked capability must not commit');
  });

  G('CSE P2 · Provenance');

  t('untrusted external content is flagged as untrusted, never authority', () => {

    const external = makeProvenance({ source: 'tool:web', kind: CERTAINTY.UNTRUSTED });

    assert(isUntrusted(external), 'retrieved/tool text MUST be untrusted (prompt-injection boundary)');
    assert(observed.certainty === 1.0 && external.derivations.length === 0, 'provenance fields populated');
  });

  // ── P2: Integrity — event log, state roots, checkpoints (§13) ─────────────────
  G('CSE P2 · Integrity');

  t('event log is an append-only, hash-chained stream that detects tampering', () => {
    const log = new EventLog();
    const e0 = log.append('commit', { tx: 'a' });
    const e1 = log.append('commit', { tx: 'b' });
    assert(log.length === 2 && e1.prev === e0.hash, 'entries chain to predecessors');
    assert(log.verify().ok, 'intact chain must verify');
    log._entries[0] = { ...e0, payload: { tx: 'TAMPERED' } }; // simulate corruption
    assert(!log.verify().ok, 'tampering must break verification');
  });

  t('state root is order-independent and changes with content', () => {
    const a = computeStateRoot({ facts: ['a', 'b'], unspent: ['u2', 'u1'] });
    const b = computeStateRoot({ facts: ['b', 'a'], unspent: ['u1', 'u2'] });
    assert(a === b, 'state root must be order-independent');
    assert(a !== computeStateRoot({ facts: ['a', 'b', 'c'] }), 'different content → different root');
  });

  t('checkpoints link to history and verify against a recomputed state root', () => {
    const root = computeStateRoot({ facts: ['alive', 'hp(5)'] });
    const cp = makeCheckpoint({ eventRangeRoot: 'evt-1', stateRoot: root, unspentRoot: 'uso-1', toSeq: 9 });
    assert(verifyCheckpoint(cp, root).ok, 'matching root verifies');
    assert(!verifyCheckpoint(cp, 'different-root').ok, 'mismatched root must fail');
    const cp2 = makeCheckpoint({ previousCheckpoint: cp.id, eventRangeRoot: 'evt-2', stateRoot: root, unspentRoot: 'uso-2' });
    assert(verifyCheckpoint(cp2, root, cp).ok, 'checkpoint chain links to predecessor');
    assert(!verifyCheckpoint(cp2, root, { id: 'wrong' }).ok, 'broken chain must fail');
  });

  // ── P3: Transactional outbox (§11, rules 41–43) ───────────────────────────────
  G('CSE P3 · Outbox');

  await ta('commit appends external-effect intents to the outbox atomically', async () => {
    const reg = new USORegistry();
    reg.create(objectVersionOutput('file.main', 1));
    const outbox = new Outbox();
    const coord = createCommitCoordinator({ usoRegistry: reg, outbox });
    const intent = makeEffectIntent({ kind: 'file.write', payload: { path: 'main' } });
    const env = sealTransactionFast(makeTransaction({
      actorID: 'a', consumeSet: ['object-version:file.main:1'], createSet: ['object-version:file.main:2'],
      externalEffectIntents: [intent],

  });

    const outbox = new Outbox();
    const intent = makeEffectIntent({ kind: 'email.send', payload: { to: 'x' } });
    outbox.record(intent, 'tx-1');
    outbox.record(intent, 'tx-1');
    assert(outbox.size === 1, 'duplicate effect id must collapse to one entry');
  });

  await ta('drain delivers pending effects; ambiguous outcomes park as RECONCILE (never guessed)', async () => {
    const outbox = new Outbox();
    const ok = makeEffectIntent({ kind: 'a' });
    const amb = makeEffectIntent({ kind: 'b' });
    outbox.record(ok); outbox.record(amb);
    const res = await outbox.drain(async (intent) => intent.id === amb.id ? { ambiguous: true } : { ok: true, ack: 'done' });
    assert(res.delivered === 1 && res.reconcile === 1, 'one delivered, one parked');
    assert(outbox.status(ok.id) === EFFECT_STATUS.ACKED, 'acked effect');
    assert(outbox.status(amb.id) === EFFECT_STATUS.RECONCILE, 'ambiguous → reconcile, not guessed');
  });

  await ta('effects requiring approval are skipped until approved', async () => {
    const outbox = new Outbox();
    const risky = makeEffectIntent({ kind: 'payment', requiresApproval: true });
    outbox.record(risky);
    const r1 = await outbox.drain(async () => ({ ok: true, ack: 1 }), { isApproved: () => false });
    assert(r1.skipped === 1 && outbox.status(risky.id) === EFFECT_STATUS.PENDING, 'unapproved effect stays pending');
    const r2 = await outbox.drain(async () => ({ ok: true, ack: 1 }), { isApproved: () => true });
    assert(r2.delivered === 1 && outbox.status(risky.id) === EFFECT_STATUS.ACKED, 'approved effect delivers');
  });

  // ── P3: Idempotent inbox (§11, rule 42) ───────────────────────────────────────
  G('CSE P3 · Inbox');

  await ta('idempotent inbox runs a handler once; redelivery returns stored result', async () => {
    const inbox = new Inbox();
    const intent = makeEffectIntent({ kind: 'apply' });
    let runs = 0;
    const handler = async () => { runs++; return 'applied'; };
    const a = await inbox.receive(intent, handler);
    const b = await inbox.receive(intent, handler);
    assert(a.result === 'applied' && !a.duplicate, 'first receive runs the handler');
    assert(b.duplicate && b.result === 'applied' && runs === 1, 'redelivery must NOT re-run the handler');
  });

  // ── P3: Sagas + compensation (§11, rules 44–45) ───────────────────────────────
  G('CSE P3 · Saga');

  await ta('a fully successful saga completes with no compensation', async () => {
    const log = [];
    const saga = new Saga([
      sagaStep({ name: 's1', forward: () => log.push('f1'), compensate: () => log.push('c1') }),
      sagaStep({ name: 's2', forward: () => log.push('f2'), compensate: () => log.push('c2') }),
    ]);
    const r = await saga.run();
    assert(r.status === SAGA_STATUS.COMPLETED, 'all steps should complete');
    assert(eq(log, ['f1', 'f2']), 'no compensation runs on success');
  });

  await ta('a pre-pivot failure compensates completed steps in reverse order', async () => {
    const log = [];
    const saga = new Saga([
      sagaStep({ name: 's1', forward: () => log.push('f1'), compensate: () => log.push('c1') }),
      sagaStep({ name: 's2', forward: () => log.push('f2'), compensate: () => log.push('c2') }),
      sagaStep({ name: 's3', forward: () => { throw new Error('boom'); } }),
    ]);
    const r = await saga.run();
    assert(r.status === SAGA_STATUS.COMPENSATED, 'failure before pivot must compensate');
    assert(eq(log, ['f1', 'f2', 'c2', 'c1']), 'compensation runs in reverse order');
  });

  await ta('a failure past the irreversible pivot does NOT roll back (forward-only)', async () => {
    const log = [];
    const saga = new Saga([
      sagaStep({ name: 's1', forward: () => log.push('f1'), compensate: () => log.push('c1') }),
      sagaStep({ name: 'pivot', forward: () => log.push('charge'), pivot: true }),
      sagaStep({ name: 's3', forward: () => { throw new Error('ship failed'); } }),
    ]);
    const r = await saga.run();
    assert(r.status === SAGA_STATUS.FAILED_PIVOTED, 'post-pivot failure cannot roll back');
    assert(!log.includes('c1'), 'compensation must NOT erase the committed pivot effect (rule 44)');
  });

  // ── P3: Reconciler (§11, rule 43) ─────────────────────────────────────────────
  G('CSE P3 · Reconciler');

  await ta('reconciler resolves parked effects by evidence: confirm / retry / escalate', async () => {
    const outbox = new Outbox();
    const confirmIt = makeEffectIntent({ kind: 'c' });
    const retryIt = makeEffectIntent({ kind: 'r', idempotent: true });
    const stuckIt = makeEffectIntent({ kind: 's', idempotent: false });
    for (const it of [confirmIt, retryIt, stuckIt]) outbox.record(it);
    // Force all three into RECONCILE via an always-ambiguous delivery.
    await outbox.drain(async () => ({ ambiguous: true }));
    const recon = new Reconciler(outbox);
    const res = await recon.reconcile(async (intent) => {
      if (intent.id === confirmIt.id) return RECONCILE_RESULT.CONFIRMED;
      if (intent.id === retryIt.id) return RECONCILE_RESULT.RETRY;
      return RECONCILE_RESULT.RETRY; // non-idempotent + unknown → must escalate, not resend
    });
    assert(res.confirmed === 1, 'confirmed effect acked from evidence');
    assert(res.retry === 1, 'idempotent effect requeued for retry');
    assert(res.escalate === 1, 'non-idempotent unknown effect escalated, never blindly resent');
    assert(outbox.status(confirmIt.id) === EFFECT_STATUS.ACKED, 'confirmed → acked');
    assert(outbox.status(retryIt.id) === EFFECT_STATUS.PENDING, 'retry → pending');
  });

  // ── P3: Reservations + escrow (§5,§10, rule 16) ───────────────────────────────
  G('CSE P3 · Reservations');

  t('a reservation is a USO: consumed at most once; expiry blocks consumption', () => {
    const reg = new USORegistry();
    const rm = new ReservationManager(reg);
    const { id } = rm.reserve({ resource: 'seat.12A', holder: 'alice', expiryEpoch: 100 });
    assert(rm.isActive(id, 50), 'reservation active before expiry');
    assert(!rm.isActive(id, 150), 'reservation inactive after expiry');
    assert(rm.consume(id, 150).reason === 'expired', 'expired reservation cannot be consumed');
    assert(rm.consume(id, 50).ok, 'in-window consume succeeds');
    assert(!rm.consume(id, 50).ok, 'a reservation can never be consumed twice');
  });

  t('a released reservation can never be consumed afterward', () => {
    const reg = new USORegistry();
    const rm = new ReservationManager(reg);
    const { id } = rm.reserve({ resource: 'seat.7B', holder: 'bob' });
    assert(rm.release(id).ok, 'release succeeds');
    assert(!rm.consume(id).ok, 'released reservation is settled');
  });

  t('bounded-counter escrow preserves the lower-bound invariant without coordination', () => {
    const esc = new BoundedCounterEscrow(10); // 10 units above floor 0
    assert(esc.grant('node-a', 4) === 4 && esc.grant('node-b', 4) === 4, 'grants carve up the pool');
    assert(esc.withdraw('node-a', 3).ok, 'local withdrawal needs no coordination');
    assert(!esc.withdraw('node-a', 2).ok, 'cannot exceed local grant (would need rebalance)');
    assert(esc.remaining === 7 && esc.withdrawn === 3, 'global accounting consistent');
    assert(esc.invariantHolds(), 'remaining never drops below the floor');
    assert(esc.reclaim('node-b') === 4 && esc.available === 6, 'reclaim returns rights to the pool');
  });

  // ── P4: CRDTs — merge is a join (assoc/comm/idempotent), rule 67 ──────────────
  G('CSE P4 · CRDTs');

  t('GCounter merge is associative, commutative, idempotent (max per node)', () => {
    const a = new GCounter().increment('x', 1);
    const b = new GCounter().increment('y', 2);
    const c = new GCounter().increment('x', 3);
    assert(a.merge(b).merge(c).equals(a.merge(b.merge(c))), 'associative');
    assert(a.merge(b).equals(b.merge(a)), 'commutative');
    assert(a.merge(a).equals(a), 'idempotent');
    assert(a.merge(c).value() === 3, 'per-node max (3), never double-counts replicas');
  });

  t('PNCounter converges and supports decrement', () => {
    let r1 = new PNCounter().increment('r1', 5).decrement('r1', 2); // value 3 locally
    let r2 = new PNCounter().increment('r2', 4);                    // value 4 locally
    const merged = r1.merge(r2);
    assert(merged.value() === 7, 'converged value = (5+4) - 2');
    assert(merged.equals(r2.merge(r1)), 'commutative merge');
  });

  t('GSet union merge is idempotent and order-independent', () => {
    const a = new GSet(['a', 'b']);
    const b = new GSet(['b', 'c']);
    assert(eq(a.merge(b).value(), ['a', 'b', 'c']), 'union of both');
    assert(a.merge(b).equals(b.merge(a)), 'commutative');
    assert(a.merge(a).equals(a), 'idempotent');
  });

  t('OR-Set resolves a concurrent add/remove as add-wins', () => {
    const s0 = new ORSet().add('x');         // tag A observed by both replicas
    const r1 = s0.remove('x');               // replica 1 removes (tombstones A)
    const r2 = s0.add('x');                  // replica 2 concurrently re-adds (tag B)
    const merged = r1.merge(r2);
    assert(merged.has('x'), 'concurrent add wins over remove');
    assert(!s0.remove('x').has('x'), 'a sequential remove with no concurrent add removes the element');
  });

    const b = new LWWRegister().set('B', 20, 'n2');
    assert(a.merge(b).value() === 'B', 'higher timestamp wins');
    assert(a.merge(b).equals(b.merge(a)), 'merge is commutative');
    const tieA = new LWWRegister().set('A', 5, 'n1');
    const tieB = new LWWRegister().set('B', 5, 'n2');
    assert(tieA.merge(tieB).value() === 'B', 'equal timestamps broken by node id');
  });

  // ── P4: Invariant confluence classifier (rule 35/36) ──────────────────────────
  G('CSE P4 · Invariant confluence');

  t('grow-only operations are I-confluent (safe without coordination)', () => {
    const res = classifyConfluence({
      initial: new GCounter(),
      merge: (a, b) => a.merge(b),
      invariant: (s) => s.value() >= 0,
      operations: [
        { name: 'inc-a', apply: (s) => s.increment('a', 1) },
        { name: 'inc-b', apply: (s) => s.increment('b', 1) },
      ],
      depth: 2,
    });
    assert(res.iConfluent, 'monotonic increments preserve value≥0 under any merge');
  });

  t('concurrent withdrawals are NOT I-confluent (must coordinate)', () => {
    const res = classifyConfluence({
      initial: 100,
      merge: (a, b) => a + b - 100, // apply both divergent withdrawals from ancestor 100
      invariant: (bal) => bal >= 0,
      operations: [{ name: 'withdraw40', apply: (s) => s - 40 }],
      depth: 2,
    });
    assert(!res.iConfluent, 'two concurrent withdrawals can overdraw the balance');
    assert(res.counterexample, 'classifier returns a concrete counterexample');
  });

  // ── P4: Optimistic validation + write-skew (rule 22/24) ───────────────────────
  G('CSE P4 · Optimistic validation');

  t('optimistic validator catches stale reads AND failed predicates (write-skew guard)', () => {
    const versions = { 'file.main': 'v14' };
    const ov = new OptimisticValidator({ versionOf: (e) => versions[e], evaluate: (p) => p === 'ok' });
    assert(ov.validate([{ entity: 'file.main', expectedVersion: 'v14' }], ['ok']).ok, 'current read + predicate validates');
    const stale = ov.validate([{ entity: 'file.main', expectedVersion: 'v13' }], ['ok']);
    assert(!stale.ok && stale.conflicts.length === 1, 'stale version detected');
    const predFail = ov.validate([{ entity: 'file.main', expectedVersion: 'v14' }], ['nope']);
    assert(!predFail.ok && predFail.failedPredicates.length === 1, 'predicate conflict detected (not just writes)');
  });

  t('write-skew is detected as a mutual read-write antidependency', () => {
    const skew = detectWriteSkew({ readSet: ['x'], writeSet: ['y'] }, { readSet: ['y'], writeSet: ['x'] });
    assert(skew.writeSkew && skew.rwAtoB && skew.rwBtoA, 'each reads what the other writes → non-serializable');
    const safe = detectWriteSkew({ readSet: ['a'], writeSet: ['a'] }, { readSet: ['b'], writeSet: ['b'] });
    assert(!safe.writeSkew, 'disjoint transactions are serializable');
  });

  // ── P4: Causality — version vectors, DVV, HLC (rule 8/9/11) ───────────────────
  G('CSE P4 · Causality');

  t('version vectors give a partial order: before / after / concurrent / equal', () => {
    const base = new VersionVector();
    const a = base.increment('n1');
    const b = base.increment('n2');
    assert(a.compare(b) === ORDER.CONCURRENT, 'independent updates are concurrent');
    const a2 = a.increment('n1');
    assert(a2.compare(a) === ORDER.AFTER && a.compare(a2) === ORDER.BEFORE, 'later dominates earlier');
    assert(base.compare(new VersionVector()) === ORDER.EQUAL, 'empty vectors are equal');
  });

  t('dotted version vectors keep concurrent writes as siblings, drop dominated', () => {
    const dvv = new DVVSet();
    dvv.update('a', new VersionVector(), 'n1');
    dvv.update('b', new VersionVector(), 'n2'); // blind concurrent write
    assert(dvv.siblingCount === 2, 'two blind concurrent writes survive as siblings');
    const { context } = dvv.read();
    dvv.update('c', context, 'n3'); // causally after both → supersedes them
    assert(dvv.siblingCount === 1 && eq(dvv.read().values, ['c']), 'a causal write collapses siblings');
  });

  t('HLC is monotonic locally even when the physical clock stalls', () => {
    let now = 1000; const clk = new HLC(() => now);
    const a = clk.now();
    const b = clk.now();
    assert(a.l === 1000 && a.c === 0, 'first stamp uses physical time');
    assert(b.l === 1000 && b.c === 1, 'counter advances when wall clock has not moved');
    assert(compareHLC(a, b) < 0, 'second event orders strictly after the first');
  });

  t('HLC merges remote causality on receive and never goes backward', () => {
    let now = 10; const clk = new HLC(() => now);
    clk.now(); // l=10, c=0
    const ts = clk.update({ l: 50, c: 7 }); // remote is ahead
    assert(ts.l === 50 && ts.c === 8, 'adopts remote physical time, counter = remote+1');
    assert(compareHLC({ l: 50, c: 7 }, ts) < 0, 'the received event is causally before the local one');

  // ── P5: Belief model — canonical vs belief separation (rules 46–48) ───────────
  G('CSE P5 · Belief model');

  t('canonical / observed / belief / predicted / proposed worlds stay separate', () => {
    const bs = new BeliefStore();
    bs.observe('door.1', 'open', { confidence: 0.9 });
    bs.believe('door.1', 'unlocked', { confidence: 0.6 });
    bs.predict('door.1', 'closed', { confidence: 0.8, horizon: 2 });
    bs.propose('door.1', 'locked');
    assert(bs.canonical('door.1') === null, 'no belief/prediction can write canonical (rule 47)');
    assert(bs.get('door.1', WORLD.OBSERVED).value === 'open', 'observed layer is isolated');
    assert(bs.get('door.1', WORLD.PREDICTED).value === 'closed', 'predicted layer is isolated');
    bs.syncCanonical('door.1', 'open'); // ONLY the commit gate may do this
    assert(bs.canonical('door.1').value === 'open' && bs.canonical('door.1').confidence === 1, 'commit mirrors canonical');
  });

    const bs = new BeliefStore();
    const near = bs.predict('x', 1, { confidence: 0.8, horizon: 1 });
    const far = bs.predict('y', 1, { confidence: 0.8, horizon: 5 });
    assert(far.confidence < near.confidence, 'further-horizon predictions are less certain');
    const obs = bs.observe('y', 1, { confidence: 0.95 });
    assert(obs.confidence > far.confidence, 'a fresh observation reduces uncertainty');
  });

  // ── P5: Object + relationship graph (§15) ─────────────────────────────────────
  G('CSE P5 · Object graph');

  t('object graph tracks stable ids and answers transitive, directed reachability', () => {
    const g = new ObjectGraph();
    g.addObject('roomA', 'room').addObject('roomB', 'room').addObject('roomC', 'room');
    g.addRelation('roomA', RELATION.CONNECTED, 'roomB');
    g.addRelation('roomB', RELATION.CONNECTED, 'roomC');
    assert(eq(g.neighbors('roomA', RELATION.CONNECTED), ['roomB']), 'direct neighbor');
    assert(g.reachable('roomA', 'roomC', RELATION.CONNECTED), 'transitive reachability over connected');
    assert(!g.reachable('roomC', 'roomA', RELATION.CONNECTED), 'edges are directed: not reachable backward');
  });

  G('CSE P5 · Affordances');

  t('affordances declare legal actions; irreversible ones require approval', () => {
    const reg = new AffordanceRegistry();
    reg.register({ action: 'open', objectType: 'door', preconditions: ['unlocked'], risk: RISK.SAFE });
    reg.register({ action: 'demolish', objectType: 'door', capabilityRequired: 'cap.demo', risk: RISK.IRREVERSIBLE });
    assert(reg.legalActions('door', (p) => p === 'unlocked').length === 2, 'both affordances satisfiable');
    assert(reg.check('door', 'open', { evaluate: (p) => p === 'unlocked' }).allowed, 'open allowed when precondition holds');
    const blocked = reg.check('door', 'open', { evaluate: () => false });
    assert(!blocked.allowed && blocked.reasons.includes('precondition:unlocked'), 'unmet precondition blocks');
    const demo = reg.check('door', 'demolish', { hasCapability: () => true, isApproved: () => false });
    assert(!demo.allowed && demo.needsApproval, 'irreversible action requires approval (rule 34)');
    assert(reg.check('door', 'demolish', { hasCapability: () => true, isApproved: () => true }).allowed, 'approved + capable → permitted (advisory)');
  });

  G('CSE P5 · Tool effects');

  t('discrepancy learner calibrates a tool from expected vs observed', () => {
    const tem = new ToolEffectModel();
    tem.expect('writer', { bytes: 100 });
    assert(tem.observe('writer', { bytes: 100 }) === 0, 'exact match → zero discrepancy');
    tem.expect('writer', { bytes: 100 });
    assert(tem.observe('writer', { bytes: 0 }) > 0, 'mismatch raises discrepancy');

  G('CSE P5 · Prediction sandbox');

    });
    const { branches, canonical } = sandbox.rollout(initial, [{ delta: -3 }, { delta: 5 }], { depth: 2 });
    assert(initial.hp === 10, 'caller state is never mutated (sandbox deep-clones)');
    assert(canonical === false && branches.every((b) => b.isTruth === false), 'predictions are never truth');

  G('CSE P6 · Shard routing');

    assert(!f.appendEntries(1, 9, [{ term: 1, command: 'b' }], 0).ok, 'prevTerm mismatch is rejected');

    assert(raft.electLeader().ok, 'leader elected with a live quorum');
    const r = raft.propose('cmd1');
    assert(r.ok && r.committed, 'committed on a quorum');
    assert(eq(raft.committedOn('n0'), ['cmd1']) && eq(raft.committedOn('n1'), ['cmd1']), 'replicated to followers');
  });

    const raft = new RaftAdapter(['n0', 'n1', 'n2']);
    raft.electLeader(); raft.propose('cmd1');
    raft.crash(raft.leader);
    const e = raft.electLeader();
    assert(e.ok && e.term >= 2, 'a new leader is elected at a higher term');
    assert(raft.committedOn(e.leader).includes('cmd1'), 'committed data survived the crash');
    assert(raft.propose('cmd2').committed, 'the new leader can commit');
  });

    const raft = new RaftAdapter(['n0', 'n1', 'n2']);
    raft.electLeader();
    const leader = raft.leader;
    for (const n of ['n0', 'n1', 'n2']) if (n !== leader) raft.crash(n); // 1 alive < quorum 2
    const r = raft.propose('x');
    assert(r.ok && !r.committed, 'cannot commit without a quorum');
    assert(!raft.electLeader().ok, 'cannot elect without a quorum');

    const ops = [{ shardId: 'shardB', key: 'y', value: 2 }, { shardId: 'shardA', key: 'x', value: 1 }];
    assert(cc.prepare('tx1', ops).ok, 'prepare acquires all locks');
    assert(cc.isPrepared('tx1'), 'tx is in-doubt after prepare');

    const r = cc.prepare('tx2', [{ shardId: 's', key: 'k', value: 2 }]);

    assert(cc.read('s', 'k') === null, 'no value written by the failed prepare');
