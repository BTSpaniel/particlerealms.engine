// Build a synthetic car EngineModel directly (no glTF needed): a body box + 4
// cylinder wheels at the corners. `named=false` exercises geometry-only detection.
function makeCar(named = true) {
  const m = createEngineModel({ name: 'car', sourceFormat: 'gltf' });
  const addBox = (id, name, t, size) => {
    const half = size.map((s) => s / 2);
    const bounds = { min: [-half[0], -half[1], -half[2]], max: [half[0], half[1], half[2]], center: [0, 0, 0], radius: Math.hypot(...half) };
    m.primitives.push(createEnginePrimitive({ id: `primitive:${id}`, mesh: `mesh:${id}`, bounds, vertexCount: 8 }));
    m.meshes.push(createEngineMesh({ id: `mesh:${id}`, name, primitives: [`primitive:${id}`], bounds }));
    m.nodes.push(createEngineNode({ id: `node:${id}`, name, translation: t, mesh: `mesh:${id}` }));
  };
  addBox('body', 'Body', [0, 0.5, 0], [2, 1, 4]);
  const wn = named ? ['Wheel_FL', 'Wheel_FR', 'Wheel_RL', 'Wheel_RR'] : ['Cyl_0', 'Cyl_1', 'Cyl_2', 'Cyl_3'];
  const wp = [[-1, 0.3, 1.5], [1, 0.3, 1.5], [-1, 0.3, -1.5], [1, 0.3, -1.5]];
  wp.forEach((p, i) => addBox('w' + i, wn[i], p, [0.2, 0.7, 0.7]));
  return m;
}
function makeBodyOnly() {
  const m = createEngineModel({ name: 'blob', sourceFormat: 'gltf' });
  const bounds = { min: [-1, -0.5, -2], max: [1, 0.5, 2], center: [0, 0, 0], radius: 2.3 };
  m.primitives.push(createEnginePrimitive({ id: 'primitive:body', mesh: 'mesh:body', bounds, vertexCount: 8 }));
  m.meshes.push(createEngineMesh({ id: 'mesh:body', name: 'Body', primitives: ['primitive:body'], bounds }));
  m.nodes.push(createEngineNode({ id: 'node:body', name: 'Body', translation: [0, 0.5, 0], mesh: 'mesh:body' }));
  return m;
}

// A car whose REAR wheels are merged into one coaxial mesh node ("BackWheels"),
// matching the real CityPack rigs: the merged node is long along the axle (X) and
// disc-shaped (Y,Z). Front wheels are separate, named with +X = left.
function makeMergedCar() {
  const m = createEngineModel({ name: 'mcar', sourceFormat: 'gltf' });
  const addBox = (id, name, t, size) => {
    const half = size.map((s) => s / 2);
    const bounds = { min: [-half[0], -half[1], -half[2]], max: [half[0], half[1], half[2]], center: [0, 0, 0], radius: Math.hypot(...half) };
    m.primitives.push(createEnginePrimitive({ id: `primitive:${id}`, mesh: `mesh:${id}`, bounds, vertexCount: 8 }));
    m.meshes.push(createEngineMesh({ id: `mesh:${id}`, name, primitives: [`primitive:${id}`], bounds }));
    m.nodes.push(createEngineNode({ id: `node:${id}`, name, translation: t, mesh: `mesh:${id}` }));
  };
  addBox('body', 'Body', [0, 0.5, 0], [2, 1, 4]);
  addBox('fl', 'Wheel_FL', [1, 0.3, 1.5], [0.2, 0.7, 0.7]);   // +X = left
  addBox('fr', 'Wheel_FR', [-1, 0.3, 1.5], [0.2, 0.7, 0.7]);
  addBox('back', 'BackWheels', [0, 0.3, -1.5], [1.5, 0.7, 0.7]); // coaxial pair, long in X
  return m;
}

// A thin disc point cloud (in the Y–Z plane, narrow in X) to exercise PCA: the
// axis of LEAST variance should be ~X (the disc's axle).
function makeDiscModel() {
  const m = createEngineModel({ name: 'disc', sourceFormat: 'gltf' });
  const pts = [];
  for (let i = 0; i < 48; i++) {
    const a = (i / 48) * Math.PI * 2;
    pts.push((Math.random() - 0.5) * 0.04, Math.cos(a) * 0.5, Math.sin(a) * 0.5); // x thin, y/z ring
  }
  const arr = new Float32Array(pts);
  const bounds = { min: [-0.02, -0.5, -0.5], max: [0.02, 0.5, 0.5], center: [0, 0, 0], radius: 0.71 };
  const prim = createEnginePrimitive({ id: 'primitive:disc', mesh: 'mesh:disc', bounds, vertexCount: arr.length / 3 });
  prim.attributes = { position: arr };
  m.primitives.push(prim);
  m.meshes.push(createEngineMesh({ id: 'mesh:disc', name: 'Disc', primitives: ['primitive:disc'], bounds }));
  m.nodes.push(createEngineNode({ id: 'node:disc', name: 'Disc', translation: [0, 0, 0], mesh: 'mesh:disc' }));
  return m;
}

function makeHumanoid(style = 'mixamo') {
  const names = style === 'vrm' ? VRM_NAMES : MIXAMO_NAMES;
  const m = createEngineModel({ name: 'human', sourceFormat: 'gltf' });
  names.forEach((name, i) => {
    m.nodes.push(createEngineNode({ id: `node:${i}`, name, parent: HUMAN_PARENTS[i] >= 0 ? `node:${HUMAN_PARENTS[i]}` : null, translation: HUMAN_TRS[i], children: [] }));
  });
  HUMAN_PARENTS.forEach((p, i) => { if (p >= 0) m.nodes[p].children.push(`node:${i}`); });
  m.skins.push({ id: 'skin:0', name: 'Armature', jointCount: names.length, raw: { joints: names.map((_, i) => i) } });
  return m;
}

function makePartialHuman() {
  const m = createEngineModel({ name: 'partial', sourceFormat: 'gltf' });
  [['mixamorig:Hips', -1, [0, 1, 0]], ['mixamorig:Spine', 0, [0, 0.1, 0]], ['mixamorig:Head', 1, [0, 0.3, 0]]]

// A synthetic pistol: long along +Z (barrel), with named sockets + a slide. The
// muzzle empty sits front-most so geometry agrees with the name.
function makeWeapon() {
  const m = createEngineModel({ name: 'Glock Pistol', sourceFormat: 'gltf' });
  const addBox = (id, name, t, size) => {
    const half = size.map((s) => s / 2);
    const bounds = { min: [-half[0], -half[1], -half[2]], max: [half[0], half[1], half[2]], center: [0, 0, 0], radius: Math.hypot(...half) };
    m.primitives.push(createEnginePrimitive({ id: `primitive:${id}`, mesh: `mesh:${id}`, bounds, vertexCount: 8 }));
    m.meshes.push(createEngineMesh({ id: `mesh:${id}`, name, primitives: [`primitive:${id}`], bounds }));
    m.nodes.push(createEngineNode({ id: `node:${id}`, name, translation: t, mesh: `mesh:${id}` }));
  };
  const addEmpty = (id, name, t) => m.nodes.push(createEngineNode({ id: `node:${id}`, name, translation: t }));
  addBox('frame', 'Frame', [0, 0, 0], [0.2, 0.5, 3.0]);     // long in Z
  addBox('slide', 'Slide', [0, 0.15, 0.3], [0.2, 0.3, 2.0]);
  addBox('barrel', 'Barrel', [0, 0.05, 1.2], [0.1, 0.1, 1.0]);
  addEmpty('muzzle', 'Muzzle', [0, 0.05, 1.7]);             // front-most
  addBox('trigger', 'Trigger', [0, -0.1, -0.2], [0.05, 0.2, 0.1]);
  addBox('grip', 'Grip', [0, -0.5, -0.5], [0.2, 0.6, 0.3]);
  addBox('mag', 'Magazine', [0, -0.7, -0.5], [0.18, 0.5, 0.25]);

}

// A hand skeleton with named finger bones (3 joints each) under a hand node.
function makeHandSkeleton() {
  const m = createEngineModel({ name: 'hand', sourceFormat: 'gltf' });
  m.nodes.push(createEngineNode({ id: 'node:0', name: 'mixamorig:RightHand', parent: null, children: [] }));
  let id = 1;
  for (const f of ['Thumb', 'Index', 'Middle', 'Ring', 'Pinky']) {
    let parent = 'node:0';
    for (let j = 1; j <= 3; j++) {
      const nid = `node:${id++}`;
      m.nodes.push(createEngineNode({ id: nid, name: `mixamorig:RightHand${f}${j}`, parent, children: [] }));
      const pn = m.nodes.find((n) => n.id === parent); if (pn) pn.children.push(nid);
      parent = nid;
    }
  }
  return m;
}

// An OPEN hand point cloud: a palm slab + 5 prongs (4 fingers + a shorter, offset
// thumb) along +Z, spread in X, thin in Y.
function makeOpenHandCloud() {
  const pts = [];
  for (let xi = -0.25; xi <= 0.251; xi += 0.1) for (let zi = 0; zi <= 0.31; zi += 0.1) for (const y of [-0.04, 0, 0.04]) pts.push([xi, y, zi]);
  for (const x of [-0.18, -0.06, 0.06, 0.18]) for (const z of [0.45, 0.6, 0.75, 0.9]) pts.push([x, 0, z]);
  for (const z of [0.45, 0.52, 0.6]) pts.push([0.30, 0, z]); // thumb: offset + shorter
  return pts;
}

// A CLENCHED fist: a compact, dense blob with no separated finger prongs (the
// fine X spacing keeps it a single lateral lobe, like a real closed-hand mesh).
function makeClenchedCloud() {
  const pts = [];
  for (let xi = -0.2; xi <= 0.201; xi += 0.02) for (let zi = 0; zi <= 0.451; zi += 0.05) for (const y of [-0.05, 0, 0.05]) pts.push([xi, y, zi]);
  return pts;
}

// A spider: a central body hub with 8 straight radial leg chains (coxa→femur→
// tibia→tarsus). No names/skin — exercises generic topology joint-limit inference.
function makeSpider() {
  const m = createEngineModel({ name: 'spider', sourceFormat: 'gltf' });
  m.nodes.push(createEngineNode({ id: 'node:0', name: 'Body', parent: null, translation: [0, 1, 0], children: [] }));
  let id = 1;
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4; const dir = [Math.cos(a) * 0.3, 0, Math.sin(a) * 0.3];
    let parent = 'node:0';
    for (let s = 0; s < 4; s++) { // coxa, femur, tibia, tarsus — straight radial
      const nid = `node:${id++}`;
      m.nodes.push(createEngineNode({ id: nid, name: `leg${k}_seg${s}`, parent, translation: dir, children: [] }));
      const pn = m.nodes.find((n) => n.id === parent); if (pn) pn.children.push(nid);
      parent = nid;
    }
  }
  return m;
}

// ── inline fixtures (no GPU, no files needed) ────────────────────────────────
const b64 = (bytes) => { let s = ''; for (const b of bytes) s += String.fromCharCode(b); return btoa(s); };
const GLTF_MAGIC_HEAD = new Uint8Array([0x67, 0x6c, 0x54, 0x46, 2, 0, 0, 0]);
const PNG_HEAD = new Uint8Array([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);

function triangleGltf() {
  const pos = new Float32Array([0, 0, 0, 1, 0, 0, 0, 1, 0]);
  const idx = new Uint16Array([0, 1, 2]);
  const buf = new Uint8Array(pos.byteLength + idx.byteLength);
  buf.set(new Uint8Array(pos.buffer), 0);
  buf.set(new Uint8Array(idx.buffer), pos.byteLength);
  return {
    asset: { version: '2.0' },
    buffers: [{ uri: 'data:application/octet-stream;base64,' + b64(buf), byteLength: buf.length }],
    bufferViews: [
      { buffer: 0, byteOffset: 0, byteLength: pos.byteLength },
      { buffer: 0, byteOffset: pos.byteLength, byteLength: idx.byteLength },
    ],
    accessors: [
      { bufferView: 0, componentType: 5126, count: 3, type: 'VEC3', min: [0, 0, 0], max: [1, 1, 0] },
      { bufferView: 1, componentType: 5123, count: 3, type: 'SCALAR' },
    ],
    meshes: [{ name: 'tri', primitives: [{ attributes: { POSITION: 0 }, indices: 1, material: 0 }] }],
    materials: [{ name: 'red', pbrMetallicRoughness: { baseColorFactor: [1, 0, 0, 1] } }],
    nodes: [{ name: 'Body', mesh: 0, children: [1] }, { name: 'Wheel_FL' }],
    scenes: [{ nodes: [0] }],
  };
}

const OBJ_TRI = 'v 0 0 0\nv 1 0 0\nv 0 1 0\nusemtl red\nf 1 2 3\n';
const STL_ASCII = 'solid t\nfacet normal 0 0 1\nouter loop\nvertex 0 0 0\nvertex 1 0 0\nvertex 0 1 0\nendloop\nendfacet\nendsolid t\n';
const PLY_ASCII = 'ply\nformat ascii 1.0\nelement vertex 3\nproperty float x\nproperty float y\nproperty float z\nelement face 1\nproperty list uchar int vertex_indices\nend_header\n0 0 0\n1 0 0\n0 1 0\n3 0 1 2\n';

function binaryStlTriangle() {
  const buf = new Uint8Array(84 + 50);
  const dv = new DataView(buf.buffer);
  dv.setUint32(80, 1, true); // 1 triangle
  let o = 84;
  const verts = [0, 0, 1, /* normal */ 0, 0, 0, 1, 0, 0, 0, 1, 0];
  for (const f of verts) { dv.setFloat32(o, f, true); o += 4; }
  return buf;
}

async function runAll() {
  const results = [];
  let group = '';
  const G = (name) => { group = name; };
  const near = (a, b, eps = 1e-6) => Math.abs(a - b) <= eps;
  const vnear = (a, b, eps = 1e-6) => a.length === b.length && a.every((x, i) => near(x, b[i], eps));
  const eqArr = vnear;
  const assert = (cond, msg) => { if (!cond) throw new Error(msg || 'assertion failed'); };
  const t = (name, fn) => {
    try { fn(); results.push({ group, name, status: 'PASS' }); }
    catch (e) { results.push({ group, name, status: 'FAIL', detail: e?.message ?? String(e) }); }
  };
  const ta = async (name, fn) => {
    try { await fn(); results.push({ group, name, status: 'PASS' }); }
    catch (e) { results.push({ group, name, status: 'FAIL', detail: e?.message ?? String(e) }); }
  };

  // ── EngineModel ─────────────────────────────────────────────────────────────
  G('Assets P0 · EngineModel');

  t('a fresh EngineModel has every layer present but explicitly unbuilt', () => {
    const m = createEngineModel({ name: 'mug' });
    for (const layer of ENGINE_MODEL_LAYERS) assert(Array.isArray(m[layer]), `${layer} missing`);
    const s = layerStatus(m);
    assert(ENGINE_MODEL_LAYERS.every((l) => s[l] === 0), 'layers should start empty (no faked layers)');
    assert(m.rigs.vehicle === null && m.rigs.weapon === null, 'rigs start null, not faked');
    assert(m.gpuReady === false, 'gpuReady starts false');
  });

  t('layerStatus reports built vs unbuilt layers', () => {
    const m = createEngineModel();
    m.nodes.push(createEngineNode({ id: 'n0', name: 'root' }));
    m.primitives.push(createEnginePrimitive({ id: 'p0', vertexCount: 3 }));
    m.rigs.vehicle = { wheels: [] };
    const s = layerStatus(m);
    assert(s.nodes === 1 && s.primitives === 1, 'built layers counted');
    assert(s.materials === 0, 'unbuilt layer stays zero');
    assert(s.rigs.vehicle === true && s.rigs.weapon === false, 'rig status reported');
  });

  t('ImportTransform defaults to canonical + full confidence and is non-destructive', () => {
    const it = createImportTransform();
    assert(it.upAxis === '+Y' && it.forwardAxis === '+Z', 'canonical default frame');
    assert(it.scaleCorrection === 1 && it.confidence === 1, 'identity correction by default');
  });

  // ── AssetRecord + license ────────────────────────────────────────────────────
  G('Assets P0 · AssetRecord');

  t('asset records carry source hash, primary, backups and converted slots', () => {
    const r = createAssetRecord({
      type: 'model', name: 'Sports Car', sourceHash: 'sha256:9ab3', sourceFormat: 'glb',
      primary: 'asset://models/vehicles/sports_car/source.glb',
      backups: ['user://imports/sports_car.glb'],
    });
    assert(r.id.startsWith('asset_model_'), 'typed id');
    assert(r.primary && r.backups.length === 1, 'primary + backups recorded');
    assert(r.converted.engineModel === null, 'converted artifacts start unbuilt');
  });

  t('unknown or conversion-disallowed licenses require review', () => {
    assert(licenseNeedsReview(createLicenseBlock()), 'unknown license flagged');
    assert(licenseNeedsReview(createLicenseBlock({ source: 'Fab', licenseType: 'standard', allowsEngineConversion: false })), 'no-conversion flagged');
    assert(!licenseNeedsReview(createLicenseBlock({ source: 'user', licenseType: 'owned', allowsEngineConversion: true })), 'owned + convertible passes');
  });

  // ── virtual paths ────────────────────────────────────────────────────────────
  G('Assets P0 · Virtual paths');

  t('parseVPath splits scheme + normalized segments; rejects bad schemes', () => {
    const p = parseVPath('asset://models/vehicles/sports_car');
    assert(p.scheme === 'asset' && p.segments.length === 3, 'parsed segments');
    assert(parseVPath('http://evil') === null, 'unknown scheme rejected');
    assert(parseVPath('not a path') === null, 'malformed rejected');
  });

  t('makeVPath + normalization collapse redundant separators', () => {
    assert(makeVPath('cache', 'models', 'a.bin') === 'cache://models/a.bin', 'joined');
    assert(makeVPath('asset', 'a//b/./c') === 'asset://a/b/c', 'normalized');
    assert(isVPath('user://imports/x.glb'), 'isVPath true for valid');
  });

  t('withScheme re-points a path for backups; basename/extension helpers work', () => {
    assert(withScheme('asset://models/car.glb', 'cache') === 'cache://models/car.glb', 're-schemed');
    assert(vpathBasename('asset://a/b/car.GLB') === 'car.GLB', 'basename');
    assert(vpathExtension('asset://a/b/car.GLB') === 'glb', 'lowercased extension');
  });

  t('cachePathFor keys converted artifacts by content hash', () => {
    const cp = cachePathFor('models', 'sha256:9ab3deadbeefcafe0011', 'enginebin');
    assert(cp.startsWith('cache://models/') && cp.endsWith('.enginebin'), 'hash-keyed cache path');
  });

  // ── canonical space ──────────────────────────────────────────────────────────
  G('Assets P0 · Canonical space');

  t('axisVector resolves tokens and rejects garbage', () => {
    assert(vnear(axisVector('+Y'), [0, 1, 0]), '+Y');
    assert(vnear(axisVector('-Z'), [0, 0, -1]), '-Z');
    let threw = false; try { axisVector('Q'); } catch (_) { threw = true; }
    assert(threw, 'bad axis rejected');
  });

  t('canonical frame (Y-up/Z-fwd) yields identity correction', () => {
    const q = axisCorrectionQuat('+Y', '+Z');
    assert(vnear(rotateVecByQuat([1, 2, 3], q), [1, 2, 3]), 'no-op for canonical input');
  });

  t('Blender frame (Z-up, -Y-fwd) maps source-up onto canonical up', () => {
    const q = axisCorrectionQuat('+Z', '-Y');
    // a Blender "up" vector (+Z) must become canonical up (+Y)
    assert(vnear(rotateVecByQuat([0, 0, 1], q), [0, 1, 0]), 'Z-up → Y-up');
    // Blender "forward" (-Y) must become canonical forward (+Z)
    assert(vnear(rotateVecByQuat([0, -1, 0], q), [0, 0, 1]), '-Y-fwd → +Z-fwd');
  });

  t('unit scale guesses convert to meters', () => {
    assert(near(unitScaleToMeters('mm'), 0.001) && near(unitScaleToMeters('cm'), 0.01), 'metric');
    assert(near(unitScaleToMeters('in'), 0.0254) && near(unitScaleToMeters('m'), 1), 'imperial + meters');
  });

  // ── Phase 1: format detection ────────────────────────────────────────────────
  G('Assets P1 · Format detection');

  t('magic bytes identify GLB and PNG', () => {
    assert(detectFormat('thing.glb', GLTF_MAGIC_HEAD).format === 'glb', 'glb magic');
    assert(detectFormat('pic.png', PNG_HEAD).format === 'png', 'png magic');
  });

  t('a lying extension is overruled by magic bytes (conflict flagged)', () => {
    const d = detectFormat('actually_a.obj', PNG_HEAD); // .obj name, PNG content
    assert(d.format === 'png' && d.conflict, 'magic wins, conflict reported');
    assert(d.confidence < 0.95, 'confidence reduced on conflict');
  });

  t('extension-only detection has lower confidence', () => {
    const d = detectFormat('mesh.obj', null);
    assert(d.format === 'obj' && d.byMagic === null && d.confidence <= 0.7, 'obj by extension');
  });

  // ── Phase 1: content hash + dedup ────────────────────────────────────────────
  G('Assets P1 · Dedup');

  await ta('hashContent is deterministic and self-describing', async () => {
    const a = await hashContent('hello-model');
    const b = await hashContent('hello-model');
    const c = await hashContent('other');
    assert(a === b, 'same bytes → same hash');
    assert(a !== c, 'different bytes → different hash');
    assert(/^(sha256|fnv1a):/.test(a), 'algorithm-tagged');
  });

  t('classify separates exact duplicates, variants, and conflicts', () => {
    const records = [
      { id: 'r1', name: 'car', sourceHash: 'sha256:aaa', metadata: { meshHash: 'm1' } },
      { id: 'r2', name: 'tree', sourceHash: 'sha256:bbb', metadata: { meshHash: 'm2' } },
    ];
    assert(classify({ sourceHash: 'sha256:aaa', name: 'car' }, records).kind === DEDUP.EXACT_DUPLICATE, 'dup');
    assert(classify({ sourceHash: 'sha256:zzz', name: 'car' }, records).kind === DEDUP.CONFLICT, 'name conflict');
    assert(classify({ sourceHash: 'sha256:zzz', name: 'new', meshHash: 'm1' }, records).kind === DEDUP.VARIANT, 'mesh variant');
    assert(classify({ sourceHash: 'sha256:zzz', name: 'new' }, records).kind === DEDUP.NEW, 'new');
  });

  await ta('registry deduplicates re-imports of the same bytes (idempotent)', async () => {
    const reg = new AssetRegistry();
    const bytes = new TextEncoder().encode('GLB-LIKE-BYTES');
    const r1 = await reg.registerSource(bytes, { name: 'car.glb', sourceFormat: 'glb', primary: 'temp://a.glb' });
    const r2 = await reg.registerSource(bytes, { name: 'car.glb', sourceFormat: 'glb', primary: 'user://b.glb' });
    assert(reg.size === 1, 'no second asset for identical source');
    assert(r2.dedup === DEDUP.EXACT_DUPLICATE, 'classified as duplicate');
    assert(r1.record.backups.includes('user://b.glb'), 'new path added as backup');
  });

  // ── Phase 1: backup resolution + repair ──────────────────────────────────────
  G('Assets P1 · Resolver');

  await ta('a missing primary is served + repaired from a hash-matching backup', async () => {
    const bytes = new TextEncoder().encode('the-real-asset');
    const hash = await hashContent(bytes);
    const resolver = new AssetResolver();
    const temp = makeMemoryBackend(); const cache = makeMemoryBackend();
    resolver.registerBackend('temp', temp).registerBackend('cache', cache);
    await cache.write('originals/x.bin', bytes); // only the backup exists
    const record = { sourceHash: hash, primary: 'temp://drop/x.bin', backups: ['cache://originals/x.bin'] };
    const res = await resolver.resolveAsset(record);
    assert(res.ok && res.source === 'cache://originals/x.bin', 'served from backup');
    assert(res.repaired, 'primary repaired');
    assert(await temp.read('drop/x.bin') != null, 'primary now restored');
  });

  await ta('a backup with the wrong content is flagged a conflict, never accepted', async () => {
    const good = new TextEncoder().encode('correct');
    const hash = await hashContent(good);
    const resolver = new AssetResolver();
    const temp = makeMemoryBackend();
    resolver.registerBackend('temp', temp);
    await temp.write('drop/x.bin', new TextEncoder().encode('TAMPERED'));
    const res = await resolver.resolveAsset({ sourceHash: hash, primary: 'temp://drop/x.bin', backups: [] });
    assert(!res.ok && res.conflicts.includes('temp://drop/x.bin'), 'wrong-hash candidate rejected');
  });

  // ── Phase 1: license gate ────────────────────────────────────────────────────
  G('Assets P1 · License gate');

  t('unknown licenses warn (advisory) but strict mode blocks', () => {
    const lax = new LicenseTracker();
    const strict = new LicenseTracker({ strict: true });
    assert(lax.evaluate({}).gate === GATE.WARN, 'advisory warn');
    assert(strict.evaluate({}).gate === GATE.BLOCK, 'strict blocks unknown');
    assert(lax.evaluate({ allowsEngineConversion: false }).gate === GATE.BLOCK, 'no-conversion always blocks');
    assert(lax.evaluate({ source: 'user', licenseType: 'owned', allowsEngineConversion: true }).allowed, 'owned passes');
  });

  // ── Phase 1: glTF scene import ───────────────────────────────────────────────
  G('Assets P1 · glTF import');

  await ta('glTF imports the full scene graph, geometry, materials, and parents', async () => {
    const model = await importGltf(triangleGltf(), { name: 'tri', sourceFormat: 'gltf' });
    assert(model.primitives.length === 1, 'one primitive');
    const prim = model.primitives[0];
    assert(prim.vertexCount === 3, 'three vertices decoded');
    assert(prim.attributes.position.length === 9, 'positions decoded');
    assert(prim.indices && prim.indices.length === 3, 'indices decoded');
    assert(prim.material === 'material:0', 'material bound to primitive');
    assert(model.materials.length === 1 && model.materials[0].raw, 'raw material preserved');
    assert(model.nodes.length === 2, 'all nodes imported');
    const wheel = model.nodes.find((n) => n.name === 'Wheel_FL');
    assert(wheel.parent === 'node:0', 'hierarchy parent link restored');
    assert(model.bounds && model.bounds.max[0] === 1, 'bounds computed');
  });

  // ── Phase 1: OBJ / STL / PLY import ──────────────────────────────────────────
  G('Assets P1 · OBJ/STL/PLY import');

  t('OBJ imports geometry and per-material groups', () => {
    const model = importObj(OBJ_TRI, { name: 'tri' });
    assert(model.primitives.length === 1 && model.primitives[0].vertexCount === 3, 'triangle');
    assert(model.materials.length === 1 && model.materials[0].name === 'red', 'usemtl group');
  });

  t('STL imports both ASCII and binary triangles', () => {
    const a = importStl(STL_ASCII, { name: 'a' });
    const b = importStl(binaryStlTriangle(), { name: 'b' });
    assert(a.primitives[0].vertexCount === 3, 'ascii STL');
    assert(b.primitives[0].vertexCount === 3, 'binary STL');
  });

  t('PLY imports vertices and triangulated faces', () => {
    const model = importPly(PLY_ASCII, { name: 'p' });
    assert(model.primitives[0].vertexCount === 3, 'three vertices');
    assert(model.primitives[0].indices.length === 3, 'one face → 3 indices');
  });

  // ── Phase 1: orientation + detectors ─────────────────────────────────────────
  G('Assets P1 · Orientation & detectors');

  t('confidence policy thresholds: auto / review / preview / neutral', () => {
    assert(classifyConfidence(0.97) === CONFIDENCE_POLICY.AUTO, 'auto');
    assert(classifyConfidence(0.8) === CONFIDENCE_POLICY.REVIEW, 'review');
    assert(classifyConfidence(0.6) === CONFIDENCE_POLICY.PREVIEW, 'preview');
    assert(classifyConfidence(0.3) === CONFIDENCE_POLICY.NEUTRAL, 'neutral');
  });

  await ta('glTF orientation auto-applies (Y-up); STL guesses a unit from size', async () => {
    const g = await importGltf(triangleGltf(), { name: 'tri', sourceFormat: 'gltf' });
    const og = resolveOrientation(g);
    assert(og.policy === CONFIDENCE_POLICY.AUTO && og.transform.upAxis === '+Y', 'glTF Y-up auto');
    const stl = importStl(STL_ASCII, { name: 'big' });
    stl.bounds = { min: [0, 0, 0], max: [3000, 10, 10], center: [1500, 5, 5], radius: 1500 };
    const os = resolveOrientation(stl);
    assert(os.transform.scaleCorrection === 0.001 && os.signals.unitGuess === 'mm', 'large STL → mm guess');
  });

  await ta('detectors summarize hierarchy and flag semantic parts (wheel→vehicle)', async () => {
    const model = await importGltf(triangleGltf(), { name: 'tri', sourceFormat: 'gltf' });
    const h = detectHierarchy(model);
    assert(h.nodeCount === 2 && h.roots.length === 1, 'hierarchy summary');
    const parts = detectParts(model);
    const wheel = parts.find((p) => p.kind === 'wheel');
    assert(wheel && wheel.side === 'front', 'Wheel_FL detected as front wheel');
    assert(detectSemanticDomain(model).domain === 'vehicle', 'domain rolled up to vehicle');
  });

  // ── Phase 1: interleave for GPU upload ───────────────────────────────────────
  G('Assets P1 · GPU interleave');

  await ta('interleaveStandard packs pos/normal/uv and generates missing normals', async () => {
    const model = await importGltf(triangleGltf(), { name: 'tri', sourceFormat: 'gltf' });
    const inter = interleaveStandard(model.primitives[0]);
    assert(inter.vertexCount === 3, 'three vertices');
    assert(inter.data.length === 3 * STANDARD_STRIDE_FLOATS, 'interleaved stride');
    // generated normal for a Z-facing triangle should point ±Z
    assert(Math.abs(inter.data[5]) > 0.9, 'flat normal generated');
  });

  // ── Phase 1: end-to-end pipeline ─────────────────────────────────────────────
  G('Assets P1 · Pipeline (end-to-end)');

  await ta('importFile detects, parses, orients, detects parts, and registers', async () => {
    const reg = new AssetRegistry();
    const bytes = new TextEncoder().encode(OBJ_TRI);
    const res = await importFile({ name: 'car.obj', bytes, registry: reg, options: { primary: 'temp://car.obj' } });
    assert(res.ok, 'import ok');
    assert(res.format.format === 'obj', 'format detected');
    assert(res.model.primitives[0].vertexCount === 3, 'geometry parsed');
    assert(res.model.importTransform, 'orientation resolved');
    assert(res.registration && reg.size === 1, 'registered once');
    assert(res.model.sourceHash && res.model.sourceHash === res.registration.record.sourceHash, 'hash linked');
  });

  // ── Phase 2: material decode ─────────────────────────────────────────────────
  G('Assets P2 · Material decode');

  await ta('glTF material decodes factors, alpha, and double-sided exactly', async () => {
    const model = await importGltf(texturedGltf(), { name: 't', sourceFormat: 'gltf' });
    const [mat] = importMaterials(model);
    assert(mat.workflow === WORKFLOW.METALLIC_ROUGHNESS, 'metallic-roughness workflow');
    assert(eqArr(mat.baseColorFactor, [1, 0, 0, 1]), 'base color');
    assert(near(mat.metallicFactor, 0.3) && near(mat.roughnessFactor, 0.7), 'metal/rough factors');
    assert(mat.alphaMode === 'mask' && near(mat.alphaCutoff, 0.3) && mat.doubleSided, 'alpha + double-sided');
    assert(eqArr(mat.emissiveFactor, [0, 0.5, 0]), 'emissive');
  });

  await ta('UV set, KHR_texture_transform, and sampler wrap/filter survive', async () => {
    const model = await importGltf(texturedGltf(), { name: 't', sourceFormat: 'gltf' });
    const [mat] = importMaterials(model);
    const bc = mat.textures.baseColor;
    assert(bc && bc.textureId === 'texture:0', 'base color bound');
    assert(bc.uvSet === 0, 'KHR_texture_transform.texCoord (0) overrides info.texCoord (1)');
    assert(hasTextureTransform(bc) && near(bc.transform.rotation, 0.5) && eqArr(bc.transform.scale, [2, 2]), 'transform preserved');
    assert(bc.colorSpace === COLOR_SPACE.SRGB && bc.usage === 'color', 'base color is sRGB');
    assert(bc.sampler.wrapU === 'clamp-to-edge' && bc.sampler.wrapV === 'repeat', 'wrap modes preserved');
    assert(bc.sampler.minFilter === 'linearMipmapLinear' && bc.sampler.magFilter === 'linear', 'filters preserved');
  });

  await ta('packed ORM channels are read exactly (rough=G, metal=B); MR is linear', async () => {
    const model = await importGltf(texturedGltf(), { name: 't', sourceFormat: 'gltf' });
    const [mat] = importMaterials(model);
    const mr = mat.textures.metallicRoughness;
    assert(mr && mr.colorSpace === COLOR_SPACE.LINEAR, 'metallic-roughness is linear data');
    assert(mr.channelUse.roughness === 'g' && mr.channelUse.metallic === 'b', 'packed channels exact');
    assert(mat.textures.occlusion.channelUse.occlusion === 'r', 'occlusion in R');
  });

  // ── Phase 2: texture normalize ───────────────────────────────────────────────
  G('Assets P2 · Texture normalize');

  await ta('textures infer colour space from bindings (sRGB wins) and carry bytes', async () => {
    const model = await importGltf(texturedGltf(), { name: 't', sourceFormat: 'gltf' });
    importMaterials(model);
    const [tex] = normalizeTextures(model);
    assert(tex.colorSpace === COLOR_SPACE.SRGB, 'shared texture used as colour ⇒ sRGB');
    assert(tex.hasBytes && tex.mimeType === 'image/png', 'embedded PNG bytes extracted');
    assert(tex.compressed === false && tex.decoded === false, 'uncompressed, not yet pixel-decoded');
  });

  // ── Phase 2: surface bindings ────────────────────────────────────────────────
  G('Assets P2 · Surface bindings');

  await ta('materials bind to primitives with uv set + semantic part', async () => {
    const model = await importGltf(texturedGltf(), { name: 't', sourceFormat: 'gltf' });
    importMaterials(model); detectParts(model);
    const bindings = buildSurfaceBindings(model);
    assert(bindings.length === model.primitives.length, 'one binding per primitive');
    const b = bindings[0];
    assert(b.materialId === 'material:0' && b.primitiveId === model.primitives[0].id, 'material↔primitive');
    assert(b.nodeId === 'node:0' && b.semanticPart === 'chassis', 'node + semantic part (Body→chassis)');
  });

  // ── Phase 2: segment views (non-destructive) ─────────────────────────────────
  G('Assets P2 · Segment views');

  await ta('segment views group by material/node without copying geometry; bake on demand', async () => {
    const model = await importGltf(texturedGltf(), { name: 't', sourceFormat: 'gltf' });
    importMaterials(model);
    const byMat = createSegmentView(model, SEGMENT_MODE.MATERIAL);
    assert(byMat.baked === false, 'view is non-destructive');
    assert(byMat.segments.length === 1 && byMat.segments[0].materialId === 'material:0', 'one material segment');
    assert(byMat.segments[0].primitiveIds.includes(model.primitives[0].id), 'references original primitive id');
    const baked = bakeSegment(model, byMat, byMat.segments[0].key);
    assert(baked.baked === true && baked.primitives.length === 1, 'bake copies only on demand');
  });

  // ── Phase 2: variants & shader-model fallback ────────────────────────────────
  G('Assets P2 · Variants & fallback');

  t('specular-glossiness approximates to metallic-roughness (original recoverable)', () => {
    const sg = createEngineMaterial({
      id: 'm', name: 'sg', workflow: WORKFLOW.SPECULAR_GLOSSINESS, roughnessFactor: 0.2,
      original: { format: 'gltf', rawMaterialIndex: 0, raw: { extensions: { KHR_materials_pbrSpecularGlossiness: { diffuseFactor: [0.8, 0.1, 0.1, 1], specularFactor: [0.9, 0.9, 0.9], glossinessFactor: 0.8 } } } },
    });
    const mr = approximateToMetallicRoughness(sg);
    assert(mr.workflow === WORKFLOW.METALLIC_ROUGHNESS, 'now metallic-roughness');
    assert(mr.metallicFactor > 0.5, 'bright specular ⇒ metallic');
    assert(near(mr.roughnessFactor, 0.2), 'roughness = 1 - glossiness');
    assert(mr.approximatedFrom === WORKFLOW.SPECULAR_GLOSSINESS, 'labelled approximation');
    assert(restoreOriginal(mr) && restoreOriginal(mr).extensions, 'original raw recoverable');
  });

  t('a variant overrides fields, shares the source, and keeps the original', () => {
    const base = createEngineMaterial({ id: 'mat:0', name: 'body', baseColorFactor: [1, 0, 0, 1], original: { raw: { name: 'body' } } });
    const blue = createMaterialVariant(base, { baseColorFactor: [0, 0, 1, 1] });
    assert(blue.variantOf === 'mat:0', 'variant lineage recorded');
    assert(eqArr(blue.baseColorFactor, [0, 0, 1, 1]), 'override applied');
    assert(base.baseColorFactor[0] === 1, 'base untouched (non-destructive)');
    assert(restoreOriginal(blue), 'original still recoverable');
  });

  // ── Phase 2: pipeline integration ────────────────────────────────────────────
  G('Assets P2 · Pipeline integration');

  await ta('importFile decodes materials, normalizes textures, and binds surfaces', async () => {
    const bytes = new TextEncoder().encode(JSON.stringify(texturedGltf()));
    const res = await importFile({ name: 'painted.gltf', bytes });
    assert(res.ok, 'import ok');
    assert(res.model.metadata.materialsDecoded && res.model.metadata.texturesNormalized, 'phase-2 passes ran');
    assert(res.model.materials[0].original, 'material decoded with recoverable original');
    assert(res.model.surfaceBindings.length === res.model.primitives.length, 'surface bindings built');
  });

  // ── Phase 3: wheel detection ─────────────────────────────────────────────────
  G('Assets P3 · Wheel detection');

  t('named wheels are detected at all four corners with sides', () => {
    const wheels = detectWheels(makeCar(true));
    assert(wheels.length === 4, `found ${wheels.length} wheels`);
    const sides = new Set(wheels.map((w) => w.side));
    assert(sides.has('front-left') && sides.has('front-right') && sides.has('rear-left') && sides.has('rear-right'), 'four corners classified');
    assert(wheels.every((w) => w.source === 'name'), 'detected by name');
  });

  t('unnamed cylinders are still detected by geometry; the chassis box is not', () => {
    const wheels = detectWheels(makeCar(false));
    assert(wheels.length === 4, `geometry-only found ${wheels.length}`);
    assert(wheels.every((w) => w.source === 'geometry'), 'detected by geometry');
    assert(wheels.every((w) => w.nodeId !== 'node:body'), 'chassis box excluded');
  });

  // ── Phase 3: chassis + rig builder ───────────────────────────────────────────
  G('Assets P3 · Rig builder');

  t('buildVehicleRig assembles 4 slots, chassis, steering + drive, high confidence', () => {
    const m = makeCar(true);
    const rig = buildVehicleRig(m, { drivetrain: 'rwd' });
    assert(rig.wheelSlots.length === 4, 'four wheel slots');
    assert(rig.chassisNode === 'node:body', 'largest mesh is chassis');
    assert(!rig.needsCorrection && rig.confidence > 0.7, 'credible vehicle');
    const front = rig.wheelSlots.filter((w) => w.canSteer);
    const drivenRear = rig.wheelSlots.filter((w) => w.driven);
    assert(front.length === 2 && front.every((w) => w.id.startsWith('front')), 'front wheels steer');

      { position: [2, 2, 0], parentIndex: 1, jointType: 'fixed' },
    ];
    const sim = createRagdollSim({ bones }, { gravity: [0, -30, 0], ground: null, iterationsPerSubstep: 4, pinned: [0, 1] });
    for (let i = 0; i < 240; i++) sim.step(1 / 60);
    const c = sim.angleConstraints[0]; const p = sim.positions();
    const d = Math.hypot(p[2][0] - p[0][0], p[2][1] - p[0][1], p[2][2] - p[0][2]);
    assert(d >= c.dMin - 0.002 && d <= c.dMax + 0.002, 'distance is inside telemetry tolerance');
    assert(Math.abs(d - c.dMin) <= 0.01 || Math.abs(d - c.dMax) <= 0.01, 'constraint can sit on a limit without being a violation');
  });

  return results;
}

async function render() {
  const start = performance.now();
  const results = await runAll();
  const ms = (performance.now() - start).toFixed(2);
  const pass = results.filter((r) => r.status === 'PASS').length;
  const fail = results.length - pass;

  document.getElementById('pill-total').textContent = `${results.length} gates`;
  document.getElementById('pill-pass').textContent = `${pass} passed`;
  document.getElementById('pill-fail').textContent = `${fail} failed`;
  document.getElementById('pill-fail').classList.toggle('ok', fail === 0);
  document.getElementById('pill-fail').classList.toggle('bad', fail !== 0);
  document.getElementById('time').textContent = `${VERSION} · ran in ${ms} ms`;

  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  let lastGroup = null;
  for (const r of results) {
    if (r.group !== lastGroup) {
      lastGroup = r.group;
      const gr = document.createElement('tr');
      gr.innerHTML = `<td></td><td class="grp" colspan="2">${r.group}</td>`;
      rows.appendChild(gr);
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="s ${r.status}">${r.status}</td><td>${r.name}</td>` +
      `<td class="detail">${r.detail ? r.detail : ''}</td>`;
    rows.appendChild(tr);
  }
}

document.getElementById('rerun').addEventListener('click', render);
render();
</script>
</body>
</html>
