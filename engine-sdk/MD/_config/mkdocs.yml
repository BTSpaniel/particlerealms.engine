# MkDocs Material configuration for the WebGPU OS docs.
# Build:  pip install -r requirements.txt && mkdocs serve -f _config/mkdocs.yml
# The docs source is the MD/ root; this config lives in MD/_config/.

site_name: WebGPU OS Docs
site_description: Unified documentation for the engine, editor, plauna, agi, and the WebGPU OS.
docs_dir: ..
site_dir: ../site

theme:
  name: material
  palette:
    scheme: slate
    primary: cyan
    accent: cyan
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# These folders are tooling/assets, not documentation pages.
exclude_docs: |
  _config/
  _templates/
  viewer/
  tools/
  assets/
  site/
  /*.json

# Reference pages are generated by tools/extract_api.py and are reachable via
# search + direct links rather than the static nav, so don't fail the build on them.
validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: ignore

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
      - Install & Run: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - Glossary: getting-started/glossary.md
      - FAQ & Troubleshooting: getting-started/faq.md
